          state.currentIndex = -1;
          state.queue = [];
          state.queuePosition = -1;
          stopImageTimer();
          clearCurrentMedia();
          await applyItemsFromSource(undefined, { reload: true, play: false });
          showToast("Плейлист очищен");
          return;
        }

        if (wasCurrent) {
          state.currentIndex = -1;
          await applyItemsFromSource(nextId, { reload: true, play: shouldPlay });
        } else {
          await applyItemsFromSource(currentId, { preserve: true, play: shouldPlay });
        }
      }

      async function recordsFromFileList(files, options = {}) {
        const records = [];
        const total = files?.length || 0;
        let lastYield = performance.now();

        for (let index = 0; index < total; index += 1) {
          const file = files[index];
          records.push({
            file,
            path: normalizePath(file.webkitRelativePath || file.name)
          });

          const elapsed = performance.now() - lastYield;
          if (index % 500 === 0 || elapsed > 80) {
            updateLoading({
              title: options.title || "Подготовка списка",
              detail: `${index + 1} / ${total}`,
              current: index + 1,
              total
            });
            lastYield = performance.now();
            await yieldToBrowser();
          }
        }

        return records;
      }

      function yieldToBrowser() {
        return new Promise((resolve) => window.setTimeout(resolve, 0));
      }

      async function recordsFromDirectoryHandle(directoryHandle, options = {}) {
        const records = [];
        let scanned = 0;
        let lastYield = performance.now();

        const maybeYield = async () => {
          scanned += 1;
          const elapsed = performance.now() - lastYield;
          if (scanned % 200 !== 0 && elapsed < 90) return;
          if (options.status) {
            els.status.textContent = `${options.status}: ${records.length} С„Р°Р№Р»РѕРІ`;
          }
          updateLoading({
            title: options.status,
            detail: `${records.length} файлов найдено`,
            current: records.length
          });
          lastYield = performance.now();
          await yieldToBrowser();
        };

        async function walk(handle, basePath) {
          for await (const entry of handle.values()) {
            const path = `${basePath}/${entry.name}`;
            if (entry.kind === "file") {
              records.push({ handle: entry, parentHandle: handle, name: entry.name, path });
            } else if (entry.kind === "directory") {
              await walk(entry, path);
            }
            await maybeYield();
          }
        }

        await walk(directoryHandle, directoryHandle.name);
        return records;
      }

      async function loadDirectoryHandle(directoryHandle, options = {}) {
        if (!directoryHandle) return false;
        const permitted = await directoryPermission(directoryHandle, Boolean(options.askPermission));
        if (!permitted) return false;

        const loadingTitle = options.status || "Загрузка папки";
        const startedLoading = !state.loading;
        if (startedLoading) startLoading(loadingTitle, directoryHandle.name || "Сканирование");

        try {
          const records = await recordsFromDirectoryHandle(directoryHandle, {
          status: options.status || "Р—Р°РіСЂСѓР·РєР° РїР°РїРєРё"
        });
        await replaceRecords(records, { loading: false, processingTitle: "Обработка файлов", autoTagNewFiles: options.autoTagNewFiles });
        state.rememberedDirectoryHandle = directoryHandle;
        if (options.save) {
          const saved = await saveRememberedDirectoryHandle(directoryHandle);
          if (!saved) showToast("Папка открыта, но браузер не дал её запомнить");
        }
        if (options.toast) showToast(options.toast);
        if (startedLoading) endLoading();
        return true;
        } catch (error) {
          if (startedLoading) endLoading();
          throw error;
        }
      }

      async function chooseDirectoryHandle() {
        try {
          const handle = await window.showDirectoryPicker({ mode: "read" });
          await loadDirectoryHandle(handle, {
            askPermission: true,
            save: true,
            toast: "Папка запомнена"
          });
        } catch (error) {
          if (error?.name !== "AbortError") showToast("Не удалось открыть папку");
        }
      }

      async function restoreRememberedDirectory() {
        const handle = await getRememberedDirectoryHandle();
        if (!handle) return;
        state.rememberedDirectoryHandle = handle;

        try {
          const restored = await loadDirectoryHandle(handle, {
            askPermission: false,
            autoTagNewFiles: false,
            status: "Р’РѕСЃСЃС‚Р°РЅРѕРІР»РµРЅРёРµ СЃРѕС…СЂР°РЅРµРЅРЅРѕР№ РїР°РїРєРё",
            toast: "Открыта сохранённая папка"
          });
          if (!restored) {
            els.status.textContent = `Сохранена папка: ${handle.name}`;
            showToast("Нажмите + Папка, чтобы разрешить доступ к сохранённой папке");
          }
        } catch {
          showToast("Сохранённая папка недоступна");
        }
      }

      async function replaceFromFileList(files) {
        if (!files?.length) return;
        const startedLoading = !state.loading;
        if (startedLoading) startLoading("Подготовка файлов", `${files.length} файлов`);

        try {
          const records = await recordsFromFileList(files, { title: "Подготовка списка" });
          await replaceRecords(records, { loading: false, processingTitle: "Обработка файлов" });
        } finally {
          if (startedLoading) endLoading();
        }
      }

      async function addFromFileList(files) {
        if (!files?.length) return;
        const startedLoading = !state.loading;
        if (startedLoading) startLoading("Подготовка файлов", `${files.length} файлов`);

        try {
          const records = await recordsFromFileList(files, { title: "Подготовка списка" });
          await addRecords(records);
        } finally {
          if (startedLoading) endLoading();
        }
      }

      async function rebuildFromSource() {
        if (!state.sourceRecords.length) return;
        const currentId = state.items[state.currentIndex]?.id;
        await applyItemsFromSource(currentId, { preserve: Boolean(currentId), play: !state.paused });
      }

      function readAllDirectoryEntries(reader) {
        return new Promise((resolve, reject) => {
          const entries = [];
          const readBatch = () => {
            reader.readEntries((batch) => {
              if (!batch.length) {
                resolve(entries);
                return;
              }
              entries.push(...batch);
              readBatch();
            }, reject);
          };
          readBatch();
        });
      }

      function entryToRecords(entry, path = entry.name) {
        if (entry.isFile) {
          return new Promise((resolve, reject) => {
            entry.file((file) => resolve([{ file, path }]), reject);
          });
        }

        if (!entry.isDirectory) return Promise.resolve([]);

        return readAllDirectoryEntries(entry.createReader()).then(async (entries) => {
          const nested = await Promise.all(entries.map((child) => entryToRecords(child, `${path}/${child.name}`)));
          return nested.flat();
        });
      }

      async function recordsFromDrop(dataTransfer) {
        const items = Array.from(dataTransfer.items || []);
        const entries = items
          .map((item) => (typeof item.webkitGetAsEntry === "function" ? item.webkitGetAsEntry() : null))
          .filter(Boolean);

        if (entries.length) {
          const nested = await Promise.all(entries.map((entry) => entryToRecords(entry)));
          return nested.flat();
        }

        return recordsFromFileList(dataTransfer.files || [], { title: "Подготовка списка" });
      }

      function updateDragState(event, active) {
        event.preventDefault();
        if (active) event.dataTransfer.dropEffect = "copy";
        els.stage.classList.toggle("dragging", active);
      }

      els.folderInput.addEventListener("change", () => {
        addFromFileList(els.folderInput.files);
      });

      els.folderButton.addEventListener("click", async (event) => {
        if (!supportsDirectoryMemory()) return;
        event.preventDefault();

        if (!state.sourceRecords.length && state.rememberedDirectoryHandle) {
          try {
            const restored = await loadDirectoryHandle(state.rememberedDirectoryHandle, {
              askPermission: true,
              autoTagNewFiles: false,
              toast: "Открыта сохранённая папка"
            });
            if (restored) return;
          } catch {
            showToast("Сохранённая папка недоступна");
          }
        }

        await chooseDirectoryHandle();
      });

      els.filesInput.addEventListener("change", () => {
        addFromFileList(els.filesInput.files);
      });

      els.autoTagButton.addEventListener("click", openAutoTagDialog);
      els.closeAutoTagDialog.addEventListener("click", closeAutoTagDialog);
      els.autoTagDialog.addEventListener("click", (event) => {
        if (event.target === els.autoTagDialog) closeAutoTagDialog();
      });
      els.autoTagRulesTab.addEventListener("click", () => selectAutoTagTab(false));
      els.autoTagPreviewTab.addEventListener("click", () => { renderAutoTagPreview(); selectAutoTagTab(true); });
      els.autoTagRuleList.addEventListener("input", editAutoTagRule);
      els.autoTagRuleList.addEventListener("change", editAutoTagRule);
      els.autoTagRuleList.addEventListener("click", (event) => {
        const button = event.target.closest("[data-delete-rule]");
        if (!button || state.autoTagTask) return;
        const id = button.closest("[data-rule-id]").dataset.ruleId;
        state.tagRules = state.tagRules.filter((rule) => rule.id !== id);
        invalidateAutoTagPreview();
        renderAutoTagRules();
        saveAutoTagRulesSoon();
      });
      els.autoTagResults.addEventListener("click", (event) => {
        if (event.target.closest("[data-more-preview]")) {
          state.autoTagPreviewCount += 100;
          renderAutoTagPreview();
        }
      });
      els.autoTagNewFiles.addEventListener("change", () => {
        state.autoTagNewFiles = els.autoTagNewFiles.checked;
        saveAutoTagRulesSoon();
      });
      els.autoTagScope.addEventListener("change", invalidateAutoTagPreview);
      els.seedAutoTagRules.addEventListener("click", () => {
        const count = seedAutoTagRules(true);
        invalidateAutoTagPreview();
        renderAutoTagRules();
        showToast(`Добавлено правил: ${count}`);
      });
      els.addAutoTagRule.addEventListener("click", () => {
        const tag = sortedTags(state.tags)[0];
        if (!tag) { showToast("Сначала создайте тег"); return; }
        const rule = newTagRule(tag, []);
        state.tagRules.push(rule);
        invalidateAutoTagPreview();
        renderAutoTagRules();
        saveAutoTagRulesSoon();
        const row = [...els.autoTagRuleList.children].find((entry) => entry.dataset.ruleId === rule.id);
        row?.querySelector("textarea").focus();
      });
      els.previewAutoTags.addEventListener("click", previewAutoTags);
      els.applyAutoTags.addEventListener("click", applyAutoTags);
      els.undoAutoTags.addEventListener("click", undoAutoTags);
      els.cancelAutoTagTask.addEventListener("click", () => {
        if (state.autoTagTask) state.autoTagTask.cancelled = true;
      });

      els.renameFileButton.addEventListener("click", () => openFileAction("rename"));
      els.deleteFileButton.addEventListener("click", () => openFileAction("delete"));
      els.closeFileDialog.addEventListener("click", closeFileAction);
      els.cancelFileDialog.addEventListener("click", closeFileAction);
      els.fileDialogForm.addEventListener("submit", confirmFileAction);
      els.fileDialog.addEventListener("click", (event) => {
        if (event.target === els.fileDialog) closeFileAction();
      });

      els.subfoldersToggle.addEventListener("change", rebuildFromSource);
      els.sortSelect.addEventListener("change", () => {
        els.shuffleToggle.checked = els.sortSelect.value === "random";
        rebuildFromSource();
      });
      els.searchInput.addEventListener("input", renderPlaylist);
      els.multipageToggle.addEventListener("change", () => {
        renderPlaylist();
        buildQueue(state.currentIndex);
      });
      els.addTagButton.addEventListener("click", createTag);
      els.tagInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          createTag();
        }
      });

      els.tagsPanel.addEventListener("click", (event) => {
        if (event.target.closest("[data-open-tag-picker]")) {
          openTagPicker();
          return;
        }

        const chip = event.target.closest(".tag-chip[data-tag]");
        if (!chip) return;
        toggleTagForCurrent(chip.dataset.tag);
      });

      els.detailInfo.addEventListener("click", (event) => {
        const dot = event.target.closest(".detail-dot[data-group-dot]");
        if (dot) {
          event.stopPropagation();
          const nextId = state.detailGroupItemIds[Number(dot.dataset.groupDot)];
          const nextIndex = itemIndexById(nextId);
          if (nextIndex >= 0) showItem(nextIndex, !state.paused);
          return;
        }

        if (event.target.closest("[data-open-tag-picker]")) {
          event.stopPropagation();
          openTagPicker();
          return;
        }

        const chip = event.target.closest(".tag-chip[data-detail-tag]");
        if (!chip) return;
        event.stopPropagation();
        toggleTagForCurrent(chip.dataset.detailTag);
      });

      els.detailDots.addEventListener("change", (event) => {
        if (!event.target.matches("[data-page-number]")) return;
        const position = Math.max(0, Math.min(state.detailGroupItemIds.length - 1, Math.round(Number(event.target.value)) - 1));
        const index = itemIndexById(state.detailGroupItemIds[position]);
        if (index >= 0) showItem(index, !state.paused);
      });
      els.detailDots.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" || !event.target.matches("[data-page-number]")) return;
        event.preventDefault();
        event.target.dispatchEvent(new Event("change", { bubbles: true }));
      });

      els.tagPickerList.addEventListener("click", (event) => {
        const deleteButton = event.target.closest(".delete-tag[data-tag]");
        if (deleteButton) {
          deleteTag(deleteButton.dataset.tag);
          return;
        }

        const choice = event.target.closest(".tag-choice[data-picker-tag]");
        if (!choice) return;
        toggleTagInPicker(choice.dataset.pickerTag, choice);
      });

      els.closeTagPicker.addEventListener("click", closeTagPicker);
      els.applyTagPicker.addEventListener("click", closeTagPicker);
      els.tagPickerSearch.addEventListener("input", renderTagPicker);
      function createPickerTag() {
        els.tagInput.value = els.pickerNewTag.value;
        createTag();
        els.pickerNewTag.value = "";
        els.pickerNewTag.focus();
      }
      els.pickerCreateTag.addEventListener("click", createPickerTag);
      els.pickerNewTag.addEventListener("keydown", (event) => {
        if (event.key === "Enter") { event.preventDefault(); createPickerTag(); }
      });
      els.thumbnailSize.addEventListener("change", () => {
        try { localStorage.setItem("mediaPlaylist.thumbnailSize", els.thumbnailSize.value); } catch { /* Optional preference. */ }
        state.galleryVisibleKey = "";
        renderGallery();
      });
      els.tagPicker.addEventListener("click", (event) => {
        if (event.target === els.tagPicker) closeTagPicker();
      });

      els.tagFilters.addEventListener("click", (event) => {
        if (event.target.closest("[data-clear-filters]")) {
          clearTagFilters();
          return;
        }

        const chip = event.target.closest(".filter-chip[data-filter-tag]");
        if (!chip) return;
        toggleTagFilter(chip.dataset.filterTag);
      });

      els.tagFilterPanel.addEventListener("click", (event) => {
        const chip = event.target.closest(".filter-tag[data-filter-tag]");
        if (!chip) return;
        toggleTagFilter(chip.dataset.filterTag);
      });

      els.shuffleToggle.addEventListener("change", () => {
        if (state.items.length) buildQueue(state.currentIndex >= 0 ? state.currentIndex : 0);
      });

      els.autoplayToggle.addEventListener("change", () => {
        const item = state.items[state.currentIndex];
        if (item?.kind === "image") {
          if (els.autoplayToggle.checked && !state.paused) startImageTimer();
          else stopImageTimer();
        }
      });

      els.loopVideoToggle.addEventListener("click", () => {
        setLoopVideo(!state.loopVideo);
      });

      els.secondsInput.addEventListener("change", () => {
        const value = Math.max(1, Math.min(120, Number(els.secondsInput.value) || 5));
        els.secondsInput.value = String(value);
        const item = state.items[state.currentIndex];
        if (item?.kind === "image" && !state.paused) startImageTimer();
      });

      els.playlist.addEventListener("click", (event) => {
        const tagButton = event.target.closest(".mini-tag[data-filter-tag]");
        if (tagButton) {
          toggleTagFilter(tagButton.dataset.filterTag);
          return;
        }

        const removeButton = event.target.closest(".remove-item");
        if (removeButton) {
          removeItem(Number(removeButton.dataset.index));
          return;
        }

        const button = event.target.closest(".select-item");
        if (!button) return;
        selectPlaylistItem(Number(button.dataset.index));
      });
      els.playlist.addEventListener("scroll", maybeAppendPlaylistBatch);

      els.prevButton.addEventListener("click", goPrevious);
      els.nextButton.addEventListener("click", goNext);
      els.detailPrevButton.addEventListener("click", (event) => {
        event.stopPropagation();
        goPrevious();
      });
      els.detailNextButton.addEventListener("click", (event) => {
        event.stopPropagation();
        goNext();
      });
      els.playButton.addEventListener("click", togglePlay);
      els.zoomOutButton.addEventListener("click", () => setZoom(state.zoom - 0.25));
      els.zoomResetButton.addEventListener("click", () => setZoom(1));
      els.zoomInButton.addEventListener("click", () => setZoom(state.zoom + 0.25));

      els.fitSelect.addEventListener("change", () => {
        state.fit = els.fitSelect.value;
        applyFit();
      });

      els.galleryToggle.addEventListener("click", () => {
        setViewMode("gallery");
      });

      els.gallerySelectToggle.addEventListener("click", () => {
        state.gallerySelectMode = !state.gallerySelectMode;
        updateGallerySelectionUi();
      });

      els.galleryBulkTagButton.addEventListener("click", openBulkTagPicker);
      els.galleryGroupButton.addEventListener("click", groupSelectedItems);
      els.galleryUngroupButton.addEventListener("click", ungroupSelectedItems);
      els.galleryClearSelection.addEventListener("click", clearGallerySelection);

      els.galleryView.addEventListener("click", (event) => {
        const videoButton = event.target.closest(".gallery-video-toggle[data-video-index]");
        if (videoButton) {
          toggleGalleryVideo(Number(videoButton.dataset.videoIndex));
          return;
        }

        const selectButton = event.target.closest(".gallery-select[data-select-index]");
        if (selectButton) {
          toggleGallerySelection(Number(selectButton.dataset.selectIndex));
          return;
        }

        const tagOpenButton = event.target.closest(".gallery-tag-open[data-tag-index]");
        if (tagOpenButton) {
          openTagPicker(Number(tagOpenButton.dataset.tagIndex));
          return;
        }

        const tagButton = event.target.closest(".mini-tag[data-filter-tag]");
        if (tagButton) {
          toggleTagFilter(tagButton.dataset.filterTag);
          return;
        }

        const openButton = event.target.closest(".gallery-open[data-index]");
        if (!openButton) return;
        const openIndex = Number(openButton.dataset.index);
        if (state.gallerySelectMode) {
          toggleGallerySelection(openIndex);
          return;
        }

        if (event.target.closest(".gallery-preview") && state.items[openIndex]?.kind === "video") {
          toggleGalleryVideo(openIndex);
          return;
        }

        selectPlaylistItem(openIndex);
      });

      els.detailOverlay.addEventListener("click", (event) => {
        if (state.viewMode !== "single") return;
        if (event.target.closest(".detail-nav")) return;
        if (event.target.closest("#mediaLayer")) return;
        if (event.target.closest("#galleryView") || event.target.closest("#galleryBulkBar")) return;
        setViewMode("gallery");
      });

      els.detailOverlay.addEventListener("wheel", (event) => {
        if (!event.ctrlKey) return;
        event.preventDefault();
        setZoom(state.zoom + (event.deltaY > 0 ? -0.1 : 0.1));
      }, { passive: false });

      els.stage.addEventListener("scroll", queueGalleryScrollWork);
      window.addEventListener("resize", handleViewportResize);
      document.addEventListener("fullscreenchange", handleViewportResize);

      els.fullscreenButton.addEventListener("click", () => {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          document.documentElement.requestFullscreen().catch(() => showToast("Полный экран недоступен"));
        }
      });

      els.videoView.addEventListener("ended", () => {
        if (state.loopVideo) return;
        if (els.autoplayToggle.checked) goNext();
      });

      els.videoView.addEventListener("click", (event) => {
        if (state.viewMode !== "single") return;
        event.preventDefault();
        event.stopPropagation();
        if (els.videoView.paused) {
          playMediaElement(els.videoView);
        } else {
          els.videoView.pause();
          state.paused = true;
          updateControls();
        }
      });

      els.audioView.addEventListener("ended", () => {
        if (els.autoplayToggle.checked) goNext();
      });

      els.videoView.addEventListener("play", () => {
        state.paused = false;
        updateControls();
      });

      els.audioView.addEventListener("play", () => {
        state.paused = false;
        updateControls();
      });

      els.videoView.addEventListener("pause", () => {
        state.paused = true;
        updateControls();
      });

      els.audioView.addEventListener("pause", () => {
        state.paused = true;
        updateControls();
      });

      els.videoView.addEventListener("error", () => showPlaybackError("video"));
      els.audioView.addEventListener("error", () => showPlaybackError("audio"));
      els.videoView.addEventListener("loadedmetadata", resizeActiveMedia);
      els.imageView.addEventListener("load", () => {
        resizeActiveMedia();
        startImageTimer();
      });
      els.imageView.addEventListener("error", () => {
        els.errorState.hidden = false;
        els.errorState.innerHTML = "<strong>Изображение не открывается</strong>Формат может не поддерживаться браузером.";
        showToast("Не удалось открыть изображение");
      });

      ["dragenter", "dragover"].forEach((name) => {
        els.stage.addEventListener(name, (event) => updateDragState(event, true));
      });

      ["dragleave", "dragend"].forEach((name) => {
        els.stage.addEventListener(name, (event) => updateDragState(event, false));
      });

      els.stage.addEventListener("drop", async (event) => {
        updateDragState(event, false);
        const startedLoading = !state.loading;
        if (startedLoading) startLoading("Подготовка файлов", "Перетаскивание");

        try {
          const records = await recordsFromDrop(event.dataTransfer);
          await addRecords(records);
        } finally {
          if (startedLoading) endLoading();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Tab") {
          const backdrop = [els.tagPicker, els.fileDialog, els.autoTagDialog].find((element) => !element.hidden);
          const roots = backdrop ? [backdrop] : state.viewMode === "single" ? [els.detailOverlay, document.querySelector(".bottom-bar")] : [];
          const focusable = roots.flatMap((root) => Array.from(root.querySelectorAll('button:not(:disabled), input:not(:disabled), select:not(:disabled), textarea:not(:disabled), [tabindex="0"]'))).filter((element) => element.getClientRects().length && !element.closest("[hidden]"));
          if (focusable.length) {
            const first = focusable[0];
            const last = focusable[focusable.length - 1];
            if (event.shiftKey && (document.activeElement === first || !focusable.includes(document.activeElement))) { event.preventDefault(); last.focus(); }
            else if (!event.shiftKey && (document.activeElement === last || !focusable.includes(document.activeElement))) { event.preventDefault(); first.focus(); }
          }
        }
        if (!els.autoTagDialog.hidden) {
          if (event.key === "Escape") {
            event.preventDefault();
            closeAutoTagDialog();
          }
          return;
        }
        if (!els.fileDialog.hidden) {
          if (event.key === "Escape") {
            event.preventDefault();
            closeFileAction();
          }
          return;
        }
        if (event.key === "Escape" && !els.tagPicker.hidden) {
          event.preventDefault();
          closeTagPicker();
          return;
        }

        if (!els.tagPicker.hidden) return;

        const tag = document.activeElement?.tagName?.toLowerCase();
        if (tag === "input" || tag === "select" || tag === "textarea") return;

        if (event.key === "Escape" && state.viewMode === "single") {
          event.preventDefault();
          setViewMode("gallery");
          return;
        }

        if (event.key === "F2" && state.viewMode === "single") {
          event.preventDefault();
          openFileAction("rename");
          return;
        }

        if (event.key === "ArrowRight") {
          event.preventDefault();
          goNext();
        }

        if (event.key === "ArrowLeft") {
          event.preventDefault();
          goPrevious();
        }

        if (event.key === " ") {
          event.preventDefault();
          togglePlay();
        }

        if (event.key.toLowerCase() === "f") {
          event.preventDefault();
          els.fullscreenButton.click();
        }

        if (event.key === "Delete") {
          event.preventDefault();
          removeItem(state.currentIndex);
        }

        if (event.key === "+" || event.key === "=") {
          event.preventDefault();
          setZoom(state.zoom + 0.25);
        }

        if (event.key === "-" || event.key === "_") {
          event.preventDefault();
          setZoom(state.zoom - 0.25);
        }
      });

      initializeIcons();
      try {
        const size = Number(localStorage.getItem("mediaPlaylist.thumbnailSize"));
        if (size >= 220 && size <= 480) els.thumbnailSize.value = String(size);
      } catch { /* Optional preference. */ }
      loadTagState();
      renderTags();
      renderTagFilters();
      renderTagFilterPanel();
      renderPlaylist();
      applyZoom();
      window.addEventListener("beforeunload", () => {
        if (state.autoTagSaveTimer) {
          try { saveAutoTagState(); } catch { /* Storage may be unavailable. */ }
        }
        clearCurrentMedia();
        clearGalleryRuntime();
      });
      updateControls();
      requestAnimationFrame(() => {
        window.setTimeout(() => {
          restoreRememberedDirectory().catch((error) => {
            reportRuntimeError(error);
            showToast("Не удалось проверить сохранённую папку");
          });
        }, 50);
      });
    })();
  </script>
</body>
</html>
