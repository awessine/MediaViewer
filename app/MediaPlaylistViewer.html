          els.tagsPanel.innerHTML = `<button class="tag-chip empty" type="button" disabled>Выберите файл</button>`;
          return;
        }

        const currentTags = sortedTags(itemTags(current));
        const assignedTagsHtml = currentTags.length
          ? currentTags.map((tag) => `
            <button class="tag-chip active" type="button" data-tag="${escapeHtml(tag)}" title="Снять тег">
              <span class="tag-name">${escapeHtml(tag)}</span>
              <span class="tag-count" aria-label="${tagUsageCount(tag)} файлов">${tagUsageCount(tag)}</span>
            </button>
          `).join("")
          : `<button class="tag-chip empty" type="button" disabled>Нет тегов</button>`;

        els.tagsPanel.innerHTML = `${assignedTagsHtml}<button class="tag-picker-open" type="button" data-open-tag-picker="true" title="Выбрать теги" aria-label="Выбрать теги">${iconSvg("Plus")}</button>`;
        if (!els.tagPicker.hidden) renderTagPicker();
        renderDetailInfo();
      }

      function renderDetailInfo() {
        const current = state.items[state.currentIndex];
        if (!current || state.viewMode !== "single") {
          els.detailInfo.hidden = true;
          els.detailTitle.textContent = "";
          els.detailTags.innerHTML = "";
          els.detailDots.innerHTML = "";
          return;
        }

        const currentTags = sortedTags(itemTags(current));
        els.detailInfo.hidden = false;
        els.detailTitle.textContent = current.name;
        els.detailTitle.title = current.path;
        els.detailTags.innerHTML = [
          ...currentTags.map((tag) => `
            <button class="tag-chip active" type="button" data-detail-tag="${escapeHtml(tag)}" title="Снять тег">
              <span class="tag-name">${escapeHtml(tag)}</span>
              <span class="tag-count" aria-label="${tagUsageCount(tag)} файлов">${tagUsageCount(tag)}</span>
            </button>
          `),
          `<button class="tag-picker-open" type="button" data-open-tag-picker="true" title="Выбрать теги" aria-label="Выбрать теги">${iconSvg("Plus")}</button>`
        ].join("");

        const ids = state.detailGroupItemIds;
        if (ids.length < 2) {
          els.detailDots.innerHTML = "";
          return;
        }
        const positions = new Set([0, ids.length - 1]);
        for (let position = Math.max(0, state.detailGroupPosition - 2); position <= Math.min(ids.length - 1, state.detailGroupPosition + 2); position += 1) positions.add(position);
        if (ids.length <= 9) ids.forEach((_, position) => positions.add(position));
        let previous = -1;
        const dots = [...positions].sort((a, b) => a - b).map((position) => {
          const gap = previous >= 0 && position - previous > 1 ? '<span class="detail-page-gap" aria-hidden="true">...</span>' : "";
          previous = position;
          return `${gap}<button class="detail-dot${position === state.detailGroupPosition ? " active" : ""}" type="button" data-group-dot="${position}" title="${position + 1} / ${ids.length}" aria-label="${position + 1} / ${ids.length}"${position === state.detailGroupPosition ? ' aria-current="page"' : ""}></button>`;
        }).join("");
        els.detailDots.innerHTML = `<div class="detail-page-dots">${dots}</div><label class="detail-page-count"><input type="number" data-page-number min="1" max="${ids.length}" value="${state.detailGroupPosition + 1}" aria-label="Страница"><span>/ ${ids.length}</span></label>`;
      }

      function renderTagPicker() {
        const current = state.items[state.currentIndex];
        const bulkDraft = state.tagDraft?.mode === "bulk";
        if (!state.tags.length) {
          els.tagPickerList.innerHTML = `<button class="tag-chip empty" type="button" disabled>Создайте тег</button>`;
          return;
        }

        const currentTags = bulkDraft
          ? state.tagDraft.tags
          : state.tagDraft?.itemId === current?.id ? state.tagDraft.tags : new Set(manualItemTags(current));
        const query = els.tagPickerSearch.value.trim().toLocaleLowerCase("ru");
        const tags = sortedTags(state.tags).filter((tag) => tag.toLocaleLowerCase("ru").includes(query));
        if (!tags.length) {
          els.tagPickerList.innerHTML = '<div class="counter">Теги не найдены</div>';
          return;
        }
        els.tagPickerList.innerHTML = tags.map((tag) => `
          <span class="tag-choice-row">
            <button class="tag-choice${currentTags.has(tag) ? " active" : ""}" type="button" data-picker-tag="${escapeHtml(tag)}" aria-pressed="${currentTags.has(tag)}" title="${bulkDraft ? "Добавить тег выбранным" : current ? "Поставить или снять тег" : "Выберите файл"}">
              <span class="tag-name">${escapeHtml(tag)}</span>
              <span class="tag-count" aria-label="${tagUsageCount(tag)} файлов">${tagUsageCount(tag)}</span>
            </button>
            <button class="delete-tag" type="button" data-tag="${escapeHtml(tag)}" title="Удалить тег" aria-label="Удалить тег ${escapeHtml(tag)}">${iconSvg("Trash2")}</button>
          </span>
        `).join("");
      }

      function openTagPicker(index = state.currentIndex) {
        const current = state.items[index];
        if (!current) {
          showToast("Сначала выберите файл");
          return;
        }

        state.tagPickerReturnFocus = document.activeElement;
        els.tagPickerSearch.value = "";
        els.pickerNewTag.value = "";
        state.currentIndex = index;
        buildQueue(index);
        updateNowText();
        renderTags();
        renderPlaylist();
        scrollActiveIntoView();
        updateControls();
        els.tagPickerTitle.textContent = folderGroupKeyForItem(current) ? "Теги папки" : "Теги файла";
        state.tagDraft = {
          mode: "single",
          itemId: current.id,
          key: tagAssignmentKeyForItem(current),
          tags: new Set(manualItemTags(current)),
          dirty: false
        };
        renderTagPicker();
        els.tagPicker.hidden = false;
        els.tagPickerSearch.focus();
      }

      function openBulkTagPicker() {
        const selected = selectedGalleryItems();
        if (!selected.length) {
          showToast("Выберите файлы в плитке");
          return;
        }

        state.tagPickerReturnFocus = document.activeElement;
        els.tagPickerSearch.value = "";
        els.pickerNewTag.value = "";
        els.tagPickerTitle.textContent = `Теги для ${selected.length} файлов`;
        state.tagDraft = {
          mode: "bulk",
          itemIds: selected.map((item) => item.id),
          tags: new Set(),
          dirty: false
        };
        renderTagPicker();
        els.tagPicker.hidden = false;
        els.tagPickerSearch.focus();
      }

      function closeTagPicker() {
        if (els.tagPicker.hidden) return;
        els.tagPicker.hidden = true;
        commitTagDraft();
        const target = state.tagPickerReturnFocus;
        let returnTarget = target;
        if (!returnTarget?.isConnected) {
          returnTarget = state.viewMode === "single"
            ? els.detailTags.querySelector("[data-open-tag-picker]")
            : els.galleryView.querySelector(`.gallery-tag-open[data-tag-index="${Number(target?.dataset.tagIndex)}"]`);
        }
        if (returnTarget?.isConnected && !returnTarget.closest("[inert]")) returnTarget.focus({ preventScroll: true });
      }

      function commitTagDraft() {
        const draft = state.tagDraft;
        state.tagDraft = null;
        if (!draft || !draft.dirty) return;

        if (draft.mode === "bulk") {
          const tagsToAdd = sortedTags(Array.from(draft.tags).filter((tag) => state.tags.includes(tag)));
          if (!tagsToAdd.length) return;

          const ids = new Set(draft.itemIds || []);
          state.items.forEach((item) => {
            if (!ids.has(item.id)) return;
            const tags = new Set(manualItemTags(item));
            tagsToAdd.forEach((tag) => tags.add(tag));
            setManualItemTags(item, sortedTags(Array.from(tags)));
          });
          saveTagState();
          renderTags();
          renderTagFilters();
          renderTagFilterPanel();
          renderPlaylist();
          return;
        }

        const item = state.items.find((entry) => entry.id === draft.itemId);
        const tags = sortedTags(Array.from(draft.tags).filter((tag) => state.tags.includes(tag)));
        if (tags.length || isFolderTagKey(draft.key)) {
          state.fileTags[draft.key] = tags;
        } else {
          delete state.fileTags[draft.key];
        }
        if (item) item.tags = manualItemTags(item);
        saveTagState();
        renderTags();
        renderTagFilters();
        renderTagFilterPanel();
        renderPlaylist();
      }

      function toggleTagInPicker(tag, button) {
        if (!state.tagDraft) return;

        if (state.tagDraft.tags.has(tag)) {
          state.tagDraft.tags.delete(tag);
          button.classList.remove("active");
        } else {
          state.tagDraft.tags.add(tag);
          button.classList.add("active");
        }
        state.tagDraft.dirty = true;
        button.setAttribute("aria-pressed", String(state.tagDraft.tags.has(tag)));
      }

      function createTag() {
        const tag = els.tagInput.value.trim();
        if (!tag) return;
        if (!state.tags.includes(tag)) {
          state.tags.push(tag);
          state.tags.sort((a, b) => collator.compare(a, b));
        }
        if (state.tagDraft && !els.tagPicker.hidden) {
          state.tagDraft.tags.add(tag);
          state.tagDraft.dirty = true;
          saveTagState();
          els.tagInput.value = "";
          els.tagPickerSearch.value = "";
          seedAutoTagRules();
          renderTagPicker();
          renderTagFilterPanel();
          return;
        }
        const bulkItems = state.viewMode === "gallery" && state.gallerySelection.size ? selectedGalleryItems() : [];
        if (bulkItems.length) {
          bulkItems.forEach((item) => {
            const tags = new Set(manualItemTags(item));
            tags.add(tag);
            setManualItemTags(item, sortedTags(Array.from(tags)));
          });
        } else {
          const item = state.items[state.currentIndex];
          if (item) {
            const tags = new Set(manualItemTags(item));
            tags.add(tag);
            setManualItemTags(item, Array.from(tags).sort((a, b) => collator.compare(a, b)));
          }
        }
        saveTagState();
        els.tagInput.value = "";
        seedAutoTagRules();
        renderTags();
        renderTagFilters();
        renderTagFilterPanel();
        renderPlaylist();
      }

      function toggleTagForCurrent(tag) {
        const item = state.items[state.currentIndex];
        if (!item) {
          showToast("Сначала выберите файл");
          return;
        }

        if (itemTags(item).includes(tag) && tag.startsWith(".") && !state.tags.includes(tag)) {
          toggleTagFilter(tag);
          return;
        }

        const tags = new Set(manualItemTags(item));
        if (tags.has(tag)) tags.delete(tag);
        else tags.add(tag);
        setManualItemTags(item, Array.from(tags).sort((a, b) => collator.compare(a, b)));
        saveTagState();
        renderTags();
        renderTagFilters();
        renderTagFilterPanel();
        renderPlaylist();
      }

      function deleteTag(tag) {
        state.tags = state.tags.filter((item) => item !== tag);
        state.tagRules = state.tagRules.filter((rule) => rule.tag !== tag);
        state.tagRulesSeeded.delete(tag);
        saveAutoTagRulesSoon();
        state.tagFilters = state.tagFilters.filter((item) => item !== tag);
        if (state.tagDraft) {
          state.tagDraft.tags.delete(tag);
          state.tagDraft.dirty = true;
        }
        Object.keys(state.fileTags).forEach((key) => {
          const nextTags = (state.fileTags[key] || []).filter((item) => item !== tag);
          if (nextTags.length || isFolderTagKey(key)) {
            state.fileTags[key] = nextTags;
          } else {
            delete state.fileTags[key];
          }
        });
        saveTagState();
        state.items.forEach((item) => {
          item.tags = manualItemTags(item);
        });
        renderTags();
        renderTagFilters();
        renderTagFilterPanel();
        renderPlaylist();
        showToast("Тег удалён");
      }

      function toggleTagFilter(tag) {
        if (state.tagFilters.includes(tag)) {
          state.tagFilters = state.tagFilters.filter((item) => item !== tag);
        } else {
          state.tagFilters = [...state.tagFilters, tag];
        }
        renderTagFilters();
        renderTagFilterPanel();
        renderPlaylist();
      }

      function clearTagFilters() {
        state.tagFilters = [];
        renderTagFilters();
        renderTagFilterPanel();
        renderPlaylist();
      }

      function visibleEntriesFrom(entries) {
        const query = normalizeSearchText(els.searchInput.value);
        const queryTokens = query.split(/\s+/).filter(Boolean);
        const filters = state.tagFilters;
        return entries
          .filter(({ item }) => {
            if (!queryTokens.length) return true;
            const name = normalizeSearchText(`${item.name} ${folderGroupKeyForItem(item)}`);
            return queryTokens.every((token) => name.includes(token));
          })
          .filter(({ item }) => {
            if (!filters.length) return true;
            const tags = new Set(itemTags(item));
            return filters.every((tag) => tags.has(tag));
          });
      }

      function visibleItemEntries() {
        return visibleEntriesFrom(state.items.map((item, index) => ({ item, index })));
      }

      function collapseGroupedEntries(entries) {
        const seenGroups = new Set();
        const collapsed = [];
        entries.forEach((entry) => {
          const { item } = entry;
          const group = groupForItem(item);
          if (!group) { collapsed.push(entry); return; }
          if (seenGroups.has(group.id)) return;
          seenGroups.add(group.id);
          collapsed.push(state.itemEntryById.get(group.itemIds[0]) || entry);
        });
        return collapsed;
      }

      function syncGalleryOrder() {
        const ids = state.itemIds;
        if (!ids.length) {
          state.galleryOrderIds = [];
          state.galleryVisibleKey = "";
          return;
        }

        if (els.sortSelect.value !== "random") {
          state.galleryOrderIds = ids;
          return;
        }

        const validIds = new Set(ids);
        const kept = state.galleryOrderIds.filter((id) => validIds.has(id));
        const keptIds = new Set(kept);
        const added = ids.filter((id) => !keptIds.has(id));
        state.galleryOrderIds = kept.concat(shuffle(added));
      }

      function visibleGalleryEntries() {
        syncGalleryOrder();
        const entries = collapseGroupedEntries(visibleEntriesFrom(state.galleryOrderIds.map((id) => state.itemEntryById.get(id)).filter(Boolean)));
        return els.multipageToggle.checked ? entries.filter(({ item }) => groupSizeForItem(item) > 1) : entries;
      }

      function galleryEntriesKey(entries) {
        const first = entries[0]?.item.id || "";
        const last = entries[entries.length - 1]?.item.id || "";
        return [
          entries.length,
          state.items.length,
          els.sortSelect.value,
          normalizeSearchText(els.searchInput.value),
          state.tagFilters.join("\u001f"),
          els.multipageToggle.checked,
          first,
          last
        ].join("\u001e");
      }

      function galleryUrlForItem(item, file = item.file) {
        if (!file) return "";
        if (!state.galleryUrls.has(item.id)) {
          state.galleryUrls.set(item.id, URL.createObjectURL(file));
        }
        return state.galleryUrls.get(item.id);
      }

      function revokeGalleryUrl(id) {
        const url = state.galleryUrls.get(id);
        if (!url) return;
        URL.revokeObjectURL(url);
        state.galleryUrls.delete(id);
      }

      function disconnectGalleryObserver() {
        if (state.galleryObserver) {
          state.galleryObserver.disconnect();
          state.galleryObserver = null;
        }
      }

      function clearGalleryUrls() {
        state.galleryUrls.forEach((url) => URL.revokeObjectURL(url));
        state.galleryUrls.clear();
      }

      function clearGalleryRuntime() {
        pauseGalleryVideos();
        disconnectGalleryObserver();
        clearGalleryUrls();
        state.galleryEntries = [];
        state.galleryVisibleKey = "";
        state.galleryColumnCount = 0;
        state.galleryColumnHeights = [];
        state.galleryRenderedCount = 0;
        state.galleryCards.clear();
        if (state.galleryScrollFrame) {
          cancelAnimationFrame(state.galleryScrollFrame);
          state.galleryScrollFrame = 0;
        }
      }

      function selectedGalleryItems() {
        return Array.from(state.gallerySelection)
          .map((id) => state.itemEntryById.get(id)?.item)
          .filter(Boolean);
      }

      function galleryCardEntry(card) {
        if (!card) return null;
        const id = card.dataset.id;
        const currentIndex = Number(card.dataset.index);
        const currentItem = state.items[currentIndex];
        if (currentItem && (!id || currentItem.id === id)) {
          return { item: currentItem, index: currentIndex };
        }

        if (id) {
          const entry = state.itemEntryById.get(id);
          if (entry) return entry;
        }

        const index = currentIndex;
        const item = state.items[index];
        return item ? { item, index } : null;
      }

      function updateGalleryVideoButton(card, playing) {
        const button = card?.querySelector(".gallery-video-toggle");
        if (!button) return;
        button.setAttribute("aria-pressed", String(playing));
        button.innerHTML = iconSvg(playing ? "Pause" : "Play");
      }

      function pauseGalleryVideos(exceptId = "") {
        if (!state.galleryPlayingId && !exceptId) return;
        const playingId = state.galleryPlayingId;
        if (playingId && playingId !== exceptId) {
          const card = state.galleryCards.get(playingId);
          card?.querySelector("video")?.pause();
          card?.classList.remove("video-playing");
          updateGalleryVideoButton(card, false);
        }
        state.galleryPlayingId = exceptId;
      }

      function pruneGallerySelection() {
        state.gallerySelection.forEach((id) => {
          if (!state.itemIdSet.has(id)) state.gallerySelection.delete(id);
        });
      }

      function updateGallerySelectionUi() {
        pruneGallerySelection();
        const count = state.gallerySelection.size;
        const selectedGroupIds = selectedGalleryGroupIds();
        els.galleryBulkBar.hidden = !state.items.length || (!state.gallerySelectMode && count === 0);
        els.gallerySelectionCount.textContent = String(count);
        els.gallerySelectToggle.setAttribute("aria-pressed", String(state.gallerySelectMode));
        els.galleryView.classList.toggle("selecting", state.gallerySelectMode);
        els.selectionActions.hidden = !state.gallerySelectMode && count === 0;
        els.galleryGroupButton.disabled = count < 2;
        els.galleryGroupButton.innerHTML = `${iconSvg("Group")}<span class="button-label">Группа${count >= 2 ? ` (${count})` : ""}</span>`;
        els.galleryUngroupButton.disabled = selectedGroupIds.length === 0;
        els.galleryUngroupButton.innerHTML = `${iconSvg("Ungroup")}<span class="button-label">Разгруппировать${selectedGroupIds.length ? ` (${selectedGroupIds.length})` : ""}</span>`;
        els.galleryBulkTagButton.disabled = count === 0;
        els.galleryClearSelection.disabled = count === 0;
        els.galleryView.querySelectorAll(".gallery-card").forEach((card) => {
          const entry = galleryCardEntry(card);
          const ids = entry ? groupSelectionIdsForIndex(entry.index) : [];
          const selected = ids.some((id) => state.gallerySelection.has(id));
          card.classList.toggle("selected", selected);
          const selectButton = card.querySelector(".gallery-select");
          if (selectButton) {
            selectButton.setAttribute("aria-pressed", String(selected));
            selectButton.innerHTML = selected ? iconSvg("Check") : "";
          }
        });
      }

      function toggleGallerySelection(index) {
        const ids = groupSelectionIdsForIndex(index);
        if (!ids.length) return;

        const selected = ids.every((id) => state.gallerySelection.has(id));
        ids.forEach((id) => {
          if (selected) state.gallerySelection.delete(id);
          else state.gallerySelection.add(id);
        });
        if (state.gallerySelection.size) state.gallerySelectMode = true;
        updateGallerySelectionUi();
      }

      function clearGallerySelection() {
        state.gallerySelection.clear();
        state.gallerySelectMode = false;
        updateGallerySelectionUi();
      }

      function selectedGalleryIdsInOrder() {
        const selected = new Set(state.gallerySelection);
        const ordered = [];
        const add = (id) => {
          if (!id || !selected.has(id) || ordered.includes(id)) return;
          ordered.push(id);
        };

        visibleGalleryEntries().forEach(({ index }) => {
          groupSelectionIdsForIndex(index).forEach(add);
        });
        state.itemIds.forEach(add);
        return ordered;
      }

      function selectedGalleryGroupIds() {
        const ids = new Set();
        state.gallerySelection.forEach((itemId) => {
          const item = state.itemEntryById.get(itemId)?.item;
          const group = groupForItem(item);
          if (group) ids.add(group.id);
        });
        return Array.from(ids);
      }

      function selectedGalleryGroups() {
        return selectedGalleryGroupIds()
          .map((id) => state.groupById.get(id))
          .filter(Boolean);
      }

      function groupSelectedItems() {
        const selectedIds = selectedGalleryIdsInOrder();
        if (selectedIds.length < 2) {
          showToast("Выберите минимум два файла");
          return;
        }

        const expandedIds = [];
        const add = (id) => {
          if (id && state.itemIdSet.has(id) && !expandedIds.includes(id)) expandedIds.push(id);
        };
        selectedIds.forEach((id) => {
          const item = state.itemEntryById.get(id)?.item;
          const group = groupForItem(item);
          if (group) group.itemIds.forEach(add);
          else add(id);
        });

        if (expandedIds.length < 2) {
          showToast("Выберите минимум два файла");
          return;
        }

        const sortedExpandedIds = sortGroupItemIds(expandedIds);
        const keys = sortedExpandedIds
          .map((id) => state.itemEntryById.get(id)?.item)
          .filter(Boolean)
          .map(tagKeyForItem);
        const expandedSet = new Set(sortedExpandedIds);
        const keySet = new Set(keys);
        state.groups = state.groups.filter((group) => {
          return !(group.itemIds || []).some((id) => expandedSet.has(id))
            && !(group.keys || []).some((key) => keySet.has(key));
        });

        const group = {
          id: `group-${++state.groupCounter}`,
          keys,
          itemIds: sortedExpandedIds
        };
        state.groups.push(group);
        buildAutoGroups();
        rebuildGroupIndex();
        saveTagState();
        state.gallerySelection.clear();
        state.gallerySelectMode = false;
        state.galleryVisibleKey = "";
        renderPlaylist();
        buildQueue(state.currentIndex >= 0 ? state.currentIndex : 0);
        renderTags();
        updateControls();
        showToast(`Сгруппировано: ${sortedExpandedIds.length}`);
      }

      function ungroupSelectedItems() {
        const groups = selectedGalleryGroups();
        if (!groups.length) {
          showToast("Выберите группу");
          return;
        }

        const groupIdSet = new Set(groups.filter((group) => !group.auto).map((group) => group.id));
        groups.filter((group) => group.auto && group.autoKey).forEach((group) => {
          state.disabledAutoGroupKeys.add(group.autoKey);
        });
        state.groups = state.groups.filter((group) => !groupIdSet.has(group.id));
        buildAutoGroups();
        rebuildGroupIndex();
        syncDetailGroup(state.currentIndex);
        saveTagState();
        state.gallerySelection.clear();
        state.gallerySelectMode = false;
        state.galleryVisibleKey = "";
        renderPlaylist();
        buildQueue(state.currentIndex >= 0 ? state.currentIndex : 0);
        renderTags();
        updateControls();
        showToast(groups.length === 1 ? "Группа расформирована" : `Расформировано групп: ${groups.length}`);
      }

      function galleryBatchSize() {
        const columns = galleryColumnCount();
        const rows = Math.max(2, Math.ceil(Math.max(1, els.stage.clientHeight) / 260));
        return Math.max(columns * 3, columns * (rows + 1));
      }

      function galleryColumnCount() {
        const available = Math.max(1, els.stage.clientWidth - 28);
        return Math.max(1, Math.floor((available + 14) / (Number(els.thumbnailSize.value) + 14)));
      }

      function galleryColumnWidth(count = galleryColumnCount()) {
        const available = Math.max(1, els.stage.clientWidth - 28);
        return Math.max(1, (available - ((count - 1) * 14)) / count);
      }

      function setupGalleryColumns(count = galleryColumnCount()) {
        state.galleryColumnCount = count;
        state.galleryColumnHeights = Array(count).fill(0);
        els.galleryView.innerHTML = Array.from({ length: count }, (_, index) => `<div class="gallery-column" data-gallery-column="${index}"></div>`).join("");
      }

      function syncGalleryColumnHeights() {
        const columns = Array.from(els.galleryView.querySelectorAll(".gallery-column"));
        if (!columns.length) return;
        state.galleryColumnHeights = columns.map((column) => column.getBoundingClientRect().height);
      }

      function shortestGalleryColumnIndex() {
        let target = 0;
        let minHeight = state.galleryColumnHeights[0] || 0;
        state.galleryColumnHeights.forEach((height, index) => {
          if (height < minHeight) {
            minHeight = height;
            target = index;
          }
        });
        return target;
      }

      function estimateGalleryCardHeight(entry) {
        const { item } = entry;
        const previewHeight = galleryPreviewHeightForItem(item);
        const tagRows = Math.max(1, Math.ceil((itemTags(item).length + 1) / 3));
        return previewHeight + 76 + (tagRows * 30);
      }

      function galleryPreviewHeightForRatio(width, height, targetWidth = galleryColumnWidth(state.galleryColumnCount || galleryColumnCount())) {
        if (!width || !height) return 190;
        return Math.max(190, Math.min(620, targetWidth * (height / width)));
      }

      function galleryPreviewHeightForItem(item, targetWidth = galleryColumnWidth(state.galleryColumnCount || galleryColumnCount())) {
        const ratio = state.galleryAspectRatios.get(item.id);
        return ratio ? galleryPreviewHeightForRatio(ratio.width, ratio.height, targetWidth) : 190;
      }

      function galleryCardStyle(item) {
        return ` style="--gallery-preview-height:${galleryPreviewHeightForItem(item)}px;"`;
      }

      function galleryPlaceholderHtml(item) {
        return `
          <div class="gallery-fallback gallery-placeholder">
            <span class="gallery-fallback-icon" aria-hidden="true">${escapeHtml(item.icon)}</span>
            <span>${escapeHtml(item.label)}</span>
          </div>
        `;
      }

      function galleryPreviewStyle(item) {
        const ratio = state.galleryAspectRatios.get(item.id);
        return ratio ? ` style="aspect-ratio:${ratio.width} / ${ratio.height};"` : "";
      }

      function rememberGalleryAspectRatio(item, preview, width, height) {
        if (!item || !preview || !width || !height) return;
        state.galleryAspectRatios.set(item.id, { width, height });
        preview.style.aspectRatio = `${width} / ${height}`;
        const card = preview.closest(".gallery-card");
        const targetWidth = preview.getBoundingClientRect().width || galleryColumnWidth(state.galleryColumnCount || galleryColumnCount());
        if (card) card.style.setProperty("--gallery-preview-height", `${galleryPreviewHeightForRatio(width, height, targetWidth)}px`);
      }

      function galleryLoadedMediaHtml(item, file) {
        const src = escapeHtml(galleryUrlForItem(item, file));
        if (item.kind === "image") {
          return `<img src="${src}" alt="${escapeHtml(item.name)}" loading="lazy">`;
        }

        if (item.kind === "video") {
          return `<video src="${src}" playsinline preload="metadata"></video><span class="gallery-kind">Видео</span>`;
        }

        return galleryPlaceholderHtml(item);
      }

      async function loadGalleryCard(card) {
        if (card.dataset.galleryLoaded === "true" || card.dataset.galleryLoading === "true") return;
        const item = state.items[Number(card.dataset.index)];
        const preview = card.querySelector(".gallery-preview");
        if (!item || !preview) return;

        card.dataset.galleryLoading = "true";
        let file;
        try {
          file = await ensureItemFile(item);
        } catch {
          card.dataset.galleryLoading = "false";
          preview.innerHTML = galleryPlaceholderHtml(item) + galleryGroupBadgeHtml(item);
          return;
        }

        if (!file || !card.isConnected) {
          card.dataset.galleryLoading = "false";
          return;
        }
        if (card.dataset.galleryLoading !== "true") return;

        const sub = card.querySelector(".gallery-sub");
        if (sub) sub.textContent = `${item.label} · ${formatItemSize(item)}`;
        preview.innerHTML = galleryLoadedMediaHtml(item, file) + galleryGroupBadgeHtml(item);
        card.dataset.galleryLoaded = "true";
        card.dataset.galleryLoading = "false";
        const media = preview.querySelector("img, video");
        if (media?.tagName === "IMG") {
          const syncImageRatio = () => rememberGalleryAspectRatio(item, preview, media.naturalWidth, media.naturalHeight);
          if (media.complete && media.naturalWidth) syncImageRatio();
          else media.addEventListener("load", syncImageRatio, { once: true });
        }
        if (media?.tagName === "VIDEO") {
          const syncVideoRatio = () => rememberGalleryAspectRatio(item, preview, media.videoWidth || 16, media.videoHeight || 9);
          if (media.readyState >= 1) syncVideoRatio();
          else media.addEventListener("loadedmetadata", syncVideoRatio, { once: true });
          media.addEventListener("play", () => {
            pauseGalleryVideos(item.id);
            state.galleryPlayingId = item.id;
            card.classList.add("video-playing");
            updateGalleryVideoButton(card, true);
          });
          media.addEventListener("pause", () => {
            if (state.galleryPlayingId === item.id) state.galleryPlayingId = "";
            card.classList.remove("video-playing");
            updateGalleryVideoButton(card, false);
          });
          media.addEventListener("ended", () => {
            if (state.galleryPlayingId === item.id) state.galleryPlayingId = "";
            card.classList.remove("video-playing");
            updateGalleryVideoButton(card, false);
          });
        }
      }

      function unloadGalleryCard(card) {
        card.dataset.galleryLoading = "false";
        if (card.dataset.galleryLoaded !== "true") return;
        const entry = galleryCardEntry(card);
        const item = entry?.item;
        const preview = card.querySelector(".gallery-preview");
        if (!item || !preview) return;

        const media = preview.querySelector("img, video");
        const video = media?.tagName === "VIDEO" ? media : null;
        if (video && !video.paused) video.pause();
        if (media) {
          media.removeAttribute("src");
          if (video) video.load();
        }
        if (state.galleryPlayingId === item.id) state.galleryPlayingId = "";
        card.classList.remove("video-playing");
        updateGalleryVideoButton(card, false);
        preview.innerHTML = galleryPlaceholderHtml(item) + galleryGroupBadgeHtml(item);
        card.dataset.galleryLoaded = "false";
        revokeGalleryUrl(item.id);
      }

      function ensureGalleryObserver() {
        if (state.galleryObserver) return;
        state.galleryObserver = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              loadGalleryCard(entry.target);
            } else {
              unloadGalleryCard(entry.target);
            }
          });
        }, {
          root: els.stage,
          rootMargin: "180px 0px",
          threshold: 0.01
        });
      }

      function observeGalleryCards(cards = els.galleryView.querySelectorAll(".gallery-card")) {
        if (state.viewMode !== "gallery") return;
        ensureGalleryObserver();
        cards.forEach((card) => {
          state.galleryObserver.observe(card);
        });
      }

      async function toggleGalleryVideo(index) {
        const item = state.items[index];
        if (!item || item.kind !== "video") return;

        const card = els.galleryView.querySelector(`.gallery-card[data-index="${index}"]`);
        if (!card) return;
        await loadGalleryCard(card);

        const video = card.querySelector("video");
        if (!video) {
          showToast("Не удалось открыть видео в плитке");
          return;
        }

        if (!video.paused) {
          video.pause();
          return;
        }

        pauseGalleryVideos(item.id);
        state.galleryPlayingId = item.id;
        try {
          await video.play();
        } catch {
          state.galleryPlayingId = "";
          card.classList.remove("video-playing");
          updateGalleryVideoButton(card, false);
          showToast("Не удалось воспроизвести видео в плитке");
        }
      }

      function galleryCardSelected(index) {
        return groupSelectionIdsForIndex(index).some((id) => state.gallerySelection.has(id));
      }

      function galleryGroupBadgeHtml(item) {
        const groupSize = groupSizeForItem(item);
        return groupSize > 1 ? `<span class="gallery-group-count">1 / ${groupSize}</span>` : "";
      }

      function gallerySubtitleForItem(item) {
        const group = groupForItem(item);
        if (group?.auto) return `${group.autoKey.split("/").pop()} · ${group.itemIds.length} страниц`;
        return `${item.label} · ${formatItemSize(item)}`;
      }

      function renderGalleryCards(entries) {
        return entries.map(({ item, index }) => `
          <article class="gallery-card${galleryCardActive(index) ? " active" : ""}${galleryCardSelected(index) ? " selected" : ""}" data-index="${index}" data-id="${escapeHtml(item.id)}" data-gallery-loaded="false" title="${escapeHtml(item.path)}"${galleryCardStyle(item)}>
            <button class="gallery-select" type="button" data-select-index="${index}" title="Выбрать файл" aria-label="Выбрать ${escapeHtml(item.name)}" aria-pressed="${galleryCardSelected(index)}">${galleryCardSelected(index) ? iconSvg("Check") : ""}</button>
            ${item.kind === "video" ? `<button class="gallery-video-toggle" type="button" data-video-index="${index}" title="Воспроизвести в плитке" aria-label="Воспроизвести ${escapeHtml(item.name)} в плитке" aria-pressed="false">${iconSvg("Play")}</button>` : ""}
            <button class="gallery-open" type="button" data-index="${index}" aria-label="Открыть ${escapeHtml(item.name)}">
              <div class="gallery-preview"${galleryPreviewStyle(item)}>${galleryPlaceholderHtml(item)}${galleryGroupBadgeHtml(item)}</div>
              <div class="gallery-meta">
                <div class="gallery-title">${escapeHtml(item.name)}</div>
                <div class="gallery-sub">${escapeHtml(gallerySubtitleForItem(item))}</div>
              </div>
            </button>
            ${galleryTagsHtml(item, index)}
          </article>
        `).join("");
      }

      function appendGalleryEntries(entries) {
        if (!entries.length) return;
        if (!state.galleryColumnCount || !els.galleryView.querySelector(".gallery-column")) {
          setupGalleryColumns();
        } else {
          syncGalleryColumnHeights();
        }

        const columns = Array.from(els.galleryView.querySelectorAll(".gallery-column"));
        const addedCards = [];
        entries.forEach((entry) => {
          if (state.galleryCards.has(entry.item.id)) return;
          const target = shortestGalleryColumnIndex();
          columns[target].insertAdjacentHTML("beforeend", renderGalleryCards([entry]));
          addedCards.push(columns[target].lastElementChild);
          state.galleryCards.set(entry.item.id, columns[target].lastElementChild);
          state.galleryColumnHeights[target] = (state.galleryColumnHeights[target] || 0) + estimateGalleryCardHeight(entry) + 16;
        });

        state.galleryRenderedCount += entries.length;
        observeGalleryCards(addedCards);
      }

      function appendGalleryBatch() {
        if (state.viewMode !== "gallery") return;
        if (state.galleryRenderedCount >= state.galleryEntries.length) return;

        const nextCount = Math.min(state.galleryEntries.length, state.galleryRenderedCount + galleryBatchSize());
        const nextEntries = state.galleryEntries.slice(state.galleryRenderedCount, nextCount);
        appendGalleryEntries(nextEntries);
      }

      function fillGalleryViewport() {
        if (state.viewMode !== "gallery") return;
        let guard = 0;
        while (state.galleryRenderedCount < state.galleryEntries.length && els.stage.scrollHeight <= els.stage.clientHeight + 320 && guard < 6) {
          appendGalleryBatch();
          guard += 1;
        }
      }

      function maybeAppendGalleryBatch() {
        if (state.viewMode !== "gallery") return;
        const distanceToBottom = els.stage.scrollHeight - els.stage.scrollTop - els.stage.clientHeight;
        if (distanceToBottom < Math.max(700, els.stage.clientHeight * 0.9)) {
          appendGalleryBatch();
          requestAnimationFrame(fillGalleryViewport);
        }
      }

      function queueGalleryScrollWork() {
        if (state.viewMode !== "gallery" || state.galleryScrollFrame) return;
        state.galleryScrollFrame = requestAnimationFrame(() => {
          state.galleryScrollFrame = 0;
          maybeAppendGalleryBatch();
        });
      }

      function rememberGalleryReturnPosition() {
        if (state.viewMode !== "gallery") return;
        state.galleryReturnScrollTop = els.stage.scrollTop;
        state.galleryReturnRenderedCount = state.galleryRenderedCount;
        state.galleryReturnPending = true;
      }

      function galleryTagsHtml(item, index) {
        const tags = sortedTags(itemTags(item));
        const activeFilters = new Set(state.tagFilters);
        return `
          <div class="gallery-card-tags">
            ${tags.map((tag) => `<button class="mini-tag${activeFilters.has(tag) ? " active" : ""}" type="button" data-filter-tag="${escapeHtml(tag)}" title="Фильтр по тегу ${escapeHtml(tag)}">${escapeHtml(tag)}</button>`).join("")}
            <button class="gallery-tag-open" type="button" data-tag-index="${index}" title="Выбрать теги" aria-label="Выбрать теги для ${escapeHtml(item.name)}">${iconSvg("Plus")}</button>
          </div>
        `;
      }

      function refreshRenderedGalleryCards() {
        const byId = new Map(state.galleryEntries.map((entry) => [entry.item.id, entry]));
        els.galleryView.querySelectorAll(".gallery-card").forEach((card) => {
          const entry = byId.get(card.dataset.id) || galleryCardEntry(card);
          if (!entry) return;
          const { item, index } = entry;

          card.dataset.index = String(index);
          card.dataset.id = item.id;
          card.title = item.path;
          card.classList.toggle("active", galleryCardActive(index));
          const title = card.querySelector(".gallery-title");
          if (title) title.textContent = item.name;

          const openButton = card.querySelector(".gallery-open");
          if (openButton) {
            openButton.dataset.index = String(index);
            openButton.setAttribute("aria-label", `Открыть ${item.name}`);
          }
          const sub = card.querySelector(".gallery-sub");
          if (sub) sub.textContent = gallerySubtitleForItem(item);

          const selectButton = card.querySelector(".gallery-select");
          if (selectButton) selectButton.dataset.selectIndex = String(index);

          const videoButton = card.querySelector(".gallery-video-toggle");
          if (videoButton) videoButton.dataset.videoIndex = String(index);

          const tagsBlock = card.querySelector(".gallery-card-tags");
          const tagsHtml = galleryTagsHtml(item, index);
          if (tagsBlock) {
            if (tagsBlock.outerHTML !== tagsHtml.trim()) tagsBlock.outerHTML = tagsHtml;
          } else card.insertAdjacentHTML("beforeend", tagsHtml);
        });
        updateGallerySelectionUi();
      }

      function renderGallery(visible = visibleGalleryEntries()) {
        if (state.viewMode !== "gallery") {
          state.galleryDirty = true;
          return;
        }
        state.galleryDirty = false;
        const visibleKey = galleryEntriesKey(visible);
        const nextColumnCount = galleryColumnCount();
        if (visible.length && state.galleryVisibleKey === visibleKey && state.galleryColumnCount === nextColumnCount && els.galleryView.querySelector(".gallery-card")) {
          state.galleryEntries = visible;
          refreshRenderedGalleryCards();
          return;
        }

        pauseGalleryVideos();
        disconnectGalleryObserver();
        clearGalleryUrls();
        state.galleryEntries = visible;
        state.galleryVisibleKey = visibleKey;
        state.galleryRenderedCount = 0;
        state.galleryColumnCount = 0;
        state.galleryColumnHeights = [];
        state.galleryCards.clear();

        if (!visible.length) {
          state.galleryEntries = [];
          els.galleryView.innerHTML = `<div class="gallery-empty">${state.items.length ? "Ничего не найдено" : "Откройте папку или перетащите файлы сюда"}</div>`;
          updateGallerySelectionUi();
          return;
        }

        const initialCount = Math.min(visible.length, galleryBatchSize());
        setupGalleryColumns(nextColumnCount);
        appendGalleryEntries(visible.slice(0, initialCount));
        requestAnimationFrame(fillGalleryViewport);
      }

      function playlistBatchSize() {
        const height = els.playlist.clientHeight || 520;
        const visibleRows = Math.max(8, Math.ceil(height / 58));
        return Math.max(120, visibleRows * 4);
      }

      function playlistItemHtml({ item, index }) {
        return `
          <div class="playlist-item${index === state.currentIndex ? " active" : ""}" role="option" aria-selected="${index === state.currentIndex}" data-index="${index}" title="${escapeHtml(item.path)}">
            <span class="type-badge" aria-hidden="true">${escapeHtml(item.icon)}</span>
            <span class="item-main">
              <button class="select-item" type="button" data-index="${index}" aria-label="Открыть ${escapeHtml(item.name)}">
                <span class="item-name">${escapeHtml(item.name)}</span>
                <span class="item-sub">${escapeHtml(item.path)}</span>
              </button>
              ${tagsHtml(item)}
            </span>
            <span class="item-size">${escapeHtml(formatSize(item.file.size))}</span>
            <button class="remove-item" type="button" data-index="${index}" title="Убрать из очереди" aria-label="Убрать ${escapeHtml(item.name)}">×</button>
          </div>
        `;
      }

      function appendPlaylistBatch(targetCount = state.playlistRenderedCount + playlistBatchSize()) {
        if (!state.playlistEntries.length) return;
        const marker = els.playlist.querySelector(".playlist-more");
        if (marker) marker.remove();

        const start = state.playlistRenderedCount;
        const nextCount = Math.min(state.playlistEntries.length, targetCount);
        if (nextCount <= start) return;

        els.playlist.insertAdjacentHTML("beforeend", state.playlistEntries.slice(start, nextCount).map(playlistItemHtml).join(""));
        state.playlistRenderedCount = nextCount;

        if (state.playlistRenderedCount < state.playlistEntries.length) {
          els.playlist.insertAdjacentHTML("beforeend", `<div class="playlist-more">Показано ${state.playlistRenderedCount} / ${state.playlistEntries.length}</div>`);
        }
      }

      function maybeAppendPlaylistBatch() {
        if (!state.playlistEntries.length) return;
        const distanceToBottom = els.playlist.scrollHeight - els.playlist.scrollTop - els.playlist.clientHeight;
        if (distanceToBottom < 420) appendPlaylistBatch();
      }

      function renderPlaylistBatched() {
        const visible = visibleItemEntries();
        state.playlistEntries = visible;
        state.playlistRenderedCount = 0;
        els.counter.textContent = `${visible.length} / ${state.items.length}`;

        if (!visible.length) {
          els.playlist.innerHTML = `<div class="playlist-empty">${state.items.length ? "Ничего не найдено" : "Откройте папку или перетащите файлы сюда"}</div>`;
          renderGallery();
          return;
        }

        els.playlist.innerHTML = "";
        const activePosition = visible.findIndex(({ index }) => index === state.currentIndex);
        const initialCount = Math.min(visible.length, Math.max(
          playlistBatchSize(),
          activePosition >= 0 && activePosition < 800 ? activePosition + 1 : 0
        ));
        appendPlaylistBatch(initialCount);
        renderGallery();
      }

      function renderPlaylist() {
        const galleryVisible = visibleGalleryEntries();
        state.playlistEntries = [];
        state.playlistRenderedCount = 0;
        els.counter.textContent = `${galleryVisible.length} / ${state.items.length}`;
        if (els.playlist) els.playlist.textContent = "";
        renderGallery(galleryVisible);
        return;
        const visible = visibleItemEntries();

        els.counter.textContent = `${visible.length} / ${state.items.length}`;

        if (!visible.length) {
          els.playlist.innerHTML = `<div class="playlist-empty">${state.items.length ? "Ничего не найдено" : "Откройте папку или перетащите файлы сюда"}</div>`;
          renderGallery();
          return;
        }

        els.playlist.innerHTML = visible.map(({ item, index }) => `
          <div class="playlist-item${index === state.currentIndex ? " active" : ""}" role="option" aria-selected="${index === state.currentIndex}" data-index="${index}" title="${escapeHtml(item.path)}">
            <span class="type-badge" aria-hidden="true">${escapeHtml(item.icon)}</span>
            <span class="item-main">
              <button class="select-item" type="button" data-index="${index}" aria-label="Открыть ${escapeHtml(item.name)}">
                <span class="item-name">${escapeHtml(item.name)}</span>
                <span class="item-sub">${escapeHtml(item.path)}</span>
              </button>
              ${tagsHtml(item)}
            </span>
            <span class="item-size">${escapeHtml(formatSize(item.file.size))}</span>
            <button class="remove-item" type="button" data-index="${index}" title="Убрать из очереди" aria-label="Убрать ${escapeHtml(item.name)}">×</button>
          </div>
        `).join("");
        renderGallery();
      }

      function updateControls() {
        const hasItems = state.items.length > 0;
        const detailMode = state.viewMode === "single";
        els.prevButton.disabled = !hasItems || !detailMode;
        els.detailPrevButton.disabled = !hasItems || !detailMode;
        els.playButton.disabled = !hasItems || !detailMode;
        els.nextButton.disabled = !hasItems || !detailMode;
        els.detailNextButton.disabled = !hasItems || !detailMode;
        els.zoomOutButton.disabled = !hasItems || !detailMode;
        els.zoomResetButton.disabled = !hasItems || !detailMode;
        els.zoomInButton.disabled = !hasItems || !detailMode;
        els.fitSelect.disabled = !hasItems || !detailMode;
        els.galleryToggle.hidden = !hasItems || !detailMode;
        els.galleryToggle.disabled = !hasItems || !detailMode;
        els.gallerySelectToggle.disabled = !hasItems || detailMode;
        els.galleryToggle.setAttribute("aria-pressed", "false");
        els.shuffleToggle.checked = Boolean(els.shuffleToggle.checked);
        els.loopVideoToggle.setAttribute("aria-pressed", String(state.loopVideo));
        els.playButton.innerHTML = iconSvg(state.paused ? "Play" : "Pause");
        els.playButton.title = state.paused ? "Пуск" : "Пауза";
        els.playButton.setAttribute("aria-label", els.playButton.title);
      }

      function setViewMode(mode) {
        const nextMode = mode === "single" && state.items.length ? "single" : "gallery";
        const galleryMode = nextMode === "gallery";
        const detailMode = nextMode === "single";
        const wasDetail = state.viewMode === "single";
        state.viewMode = nextMode;
        els.app.classList.toggle("detail-mode", detailMode);
        els.stage.classList.toggle("gallery-mode", galleryMode);
        els.stage.classList.toggle("detail-open", detailMode);
        els.stage.inert = detailMode;
        els.detailOverlay.hidden = !detailMode;
        els.galleryView.hidden = !state.items.length;
        els.mediaLayer.hidden = !detailMode;

        if (galleryMode) {
          state.mediaLoadToken += 1;
          stopImageTimer();
          clearCurrentMedia();
          state.paused = true;
          els.emptyState.hidden = true;
          els.errorState.hidden = true;
          if (!wasDetail || state.galleryDirty || state.galleryColumnCount !== galleryColumnCount()) renderGallery();
          if (!state.galleryCards.size && state.galleryEntries.length) appendGalleryBatch();
          state.galleryReturnPending = false;
          if (wasDetail) els.stage.focus({ preventScroll: true });
        } else {
          if (state.items.length) {
            els.emptyState.hidden = true;
            els.errorState.hidden = true;
          }
          resizeActiveMedia();
        }

        updateControls();
        if (galleryMode) els.galleryBulkBar.hidden = !state.items.length || (!state.gallerySelectMode && !state.gallerySelection.size);
      }

      function setLoopVideo(enabled) {
        state.loopVideo = Boolean(enabled);
        els.videoView.loop = state.loopVideo;
        els.loopVideoToggle.setAttribute("aria-pressed", String(state.loopVideo));
      }

      function clearCurrentMedia() {
        [els.videoView, els.audioView].forEach((media) => {
          media.pause();
          media.removeAttribute("src");
          media.load();
          media.hidden = true;
        });
        els.imageView.removeAttribute("src");
        els.imageView.style.width = "";
        els.imageView.style.height = "";
        els.videoView.style.width = "";
        els.videoView.style.height = "";
        els.audioView.style.width = "";
        els.audioView.style.height = "";
        els.imageView.hidden = true;
        els.mediaLayer.classList.remove("scrollable");
        if (state.objectUrl) {
          URL.revokeObjectURL(state.objectUrl);
          state.objectUrl = "";
        }
      }

      function hideAllMedia() {
        els.emptyState.hidden = true;
        els.errorState.hidden = true;
        els.imageView.hidden = true;
        els.videoView.hidden = true;
        els.audioView.hidden = true;
      }

      function applyFit() {
        [els.imageView, els.videoView, els.audioView].forEach((element) => {
          element.classList.toggle("cover", state.fit === "cover");
          element.classList.toggle("original", state.fit === "original");
        });
        resizeActiveMedia();
      }

      function applyZoom() {
        els.zoomResetButton.textContent = `${Math.round(state.zoom * 100)}%`;
        resizeActiveMedia();
      }

      function setZoom(value) {
        state.zoom = Math.max(0.25, Math.min(5, Math.round(value * 100) / 100));
        applyZoom();
      }

      function activeMediaElement() {
        const item = state.items[state.currentIndex];
        if (!item) return null;
        if (item.kind === "image") return els.imageView;
        if (item.kind === "video") return els.videoView;
        if (item.kind === "audio") return els.audioView;
        return null;
      }

      function naturalSizeFor(item, element) {
        if (!item || !element) return null;
        if (item.kind === "image") {
          if (!element.naturalWidth || !element.naturalHeight) return null;
          return {
            width: element.naturalWidth,
            height: element.naturalHeight
          };
        }
        if (item.kind === "video") {
          return {
            width: element.videoWidth || 16,
            height: element.videoHeight || 9
          };
        }
        return { width: 760, height: 54 };
      }

      function fittedSize(natural, viewport) {
        if (state.fit === "cover") {
          return { width: viewport.width, height: viewport.height };
        }

        if (state.fit === "original") {
          return { width: natural.width, height: natural.height };
        }

        const scale = Math.min(viewport.width / natural.width, viewport.height / natural.height);
        return {
          width: natural.width * scale,
          height: natural.height * scale
        };
      }

      function resizeActiveMedia() {
        const item = state.items[state.currentIndex];
        const element = activeMediaElement();
        if (!item || !element || element.hidden) return;

        if (item.kind === "audio") {
          element.style.width = "";
          element.style.height = "";
          els.mediaLayer.classList.remove("scrollable");
          positionDetailNav();
          return;
        }

        const padding = state.viewMode === "single" ? 56 : 32;
        let detailInfoHeight = state.viewMode === "single" && !els.detailInfo.hidden
          ? els.detailInfo.offsetHeight + 18
          : 0;
        const viewport = {
          width: Math.max(1, els.stage.clientWidth - padding),
          height: Math.max(1, els.stage.clientHeight - padding - detailInfoHeight)
        };
        const natural = naturalSizeFor(item, element);
        if (!natural || !natural.width || !natural.height) return;

        for (let pass = 0; pass < 3; pass += 1) {
          const base = fittedSize(natural, viewport);
          const width = Math.max(1, Math.round(base.width * state.zoom));
          const height = Math.max(1, Math.round(base.height * state.zoom));
          element.style.width = `${width}px`;
          element.style.height = `${height}px`;
          const infoWidth = Math.max(width, state.detailGroupItemIds.length > 1 ? 200 : 0);
          els.detailInfo.style.width = `${Math.min(infoWidth, viewport.width, 720)}px`;
          els.mediaLayer.classList.toggle("scrollable", width > viewport.width || height > viewport.height);
          const nextInfoHeight = !els.detailInfo.hidden ? els.detailInfo.offsetHeight + 18 : 0;
          if (Math.abs(nextInfoHeight - detailInfoHeight) < 1) break;
          detailInfoHeight = nextInfoHeight;
          viewport.height = Math.max(1, els.stage.clientHeight - padding - detailInfoHeight);
        }
        positionDetailNav();
      }

      function positionDetailNav() {
        if (state.viewMode !== "single") return;
        const element = activeMediaElement() || els.mediaLayer;
        const target = element && !element.hidden ? element : els.mediaLayer;
        const rect = target.getBoundingClientRect();
        const stageRect = els.stage.getBoundingClientRect();
        const top = rect.top - stageRect.top + (rect.height / 2);
        const halfHeight = (els.detailPrevButton.offsetHeight || 54) / 2;
        els.detailPrevButton.style.top = `${Math.max(0, Math.min(els.stage.clientHeight - (halfHeight * 2), top - halfHeight))}px`;
        els.detailNextButton.style.top = els.detailPrevButton.style.top;
        els.detailPrevButton.style.left = `${Math.max(12, rect.left - stageRect.left - 58)}px`;
        els.detailNextButton.style.right = `${Math.max(12, stageRect.right - rect.right - 58)}px`;
      }

      function handleViewportResize() {
        resizeActiveMedia();
        if (state.viewMode === "gallery" && state.galleryColumnCount && state.galleryColumnCount !== galleryColumnCount()) {
          renderGallery();
        }
      }

      function setPlaylistItemActive(index, active) {
        const item = els.playlist.querySelector(`.playlist-item[data-index="${index}"]`);
        if (!item) return;
        item.classList.toggle("active", active);
        item.setAttribute("aria-selected", String(active));
      }

      function setGalleryCardActive(index, active) {
        const group = groupForItem(state.items[index]);
        const ids = group ? group.itemIds : [state.items[index]?.id];
        for (const id of ids) {
          const card = state.galleryCards.get(id);
          if (card) {
            card.classList.toggle("active", active);
            break;
          }
        }
      }

      function updateActiveFileUi(previousIndex, nextIndex) {
        if (previousIndex !== nextIndex) {
          setPlaylistItemActive(previousIndex, false);
          setPlaylistItemActive(nextIndex, true);
          setGalleryCardActive(previousIndex, false);
          setGalleryCardActive(nextIndex, true);
        }
        renderTags();
        updateControls();
      }

      async function showItem(index, shouldPlay) {
        if (!state.items[index]) return;
        const previousIndex = state.currentIndex;
        const loadToken = state.mediaLoadToken + 1;
        state.mediaLoadToken = loadToken;
        if (state.viewMode === "gallery") {
          rememberGalleryReturnPosition();
          setViewMode("single");
        }

        pauseGalleryVideos();
        stopImageTimer();
        clearCurrentMedia();
        state.currentIndex = index;
        state.zoom = 1;
        state.fit = "contain";
        els.fitSelect.value = "contain";
        let queuePosition = queuePositionForIndex(index);
        if (queuePosition < 0) {
          buildQueue(index);
          queuePosition = queuePositionForIndex(index);
        }
        state.queuePosition = Math.max(0, queuePosition);
        syncDetailGroup(index);
        state.paused = !shouldPlay;

        const item = state.items[index];
        hideAllMedia();

        els.nowTitle.textContent = item.name;
        els.nowSub.textContent = `${index + 1} / ${state.items.length} · ${item.label} · ${formatItemSize(item)}`;
        els.progressBar.style.width = `${Math.round(((index + 1) / state.items.length) * 100)}%`;
        updateActiveFileUi(previousIndex, index);

        let file;
        try {
          file = await ensureItemFile(item);
        } catch {
          if (loadToken !== state.mediaLoadToken) return;
          showPlaybackError(item.kind === "audio" ? "audio" : "video");
          return;
        }
        if (loadToken !== state.mediaLoadToken || !file) return;

        const url = URL.createObjectURL(file);
        state.objectUrl = url;
        els.nowSub.textContent = `${index + 1} / ${state.items.length} · ${item.label} · ${formatItemSize(item)}`;

        if (item.kind === "image") {
          els.imageView.src = url;
          els.imageView.alt = item.name;
          els.imageView.hidden = false;
          if (shouldPlay) startImageTimer();
        }

        if (item.kind === "video") {
          els.videoView.src = url;
          els.videoView.loop = state.loopVideo;
          els.videoView.hidden = false;
          if (shouldPlay) playMediaElement(els.videoView);
        }

        if (item.kind === "audio") {
          els.audioView.src = url;
          els.audioView.hidden = false;
          if (shouldPlay) playMediaElement(els.audioView);
        }

        applyFit();
        applyZoom();
        updateControls();
      }

      function playMediaElement(element) {
        const promise = element.play();
        if (promise && typeof promise.catch === "function") {
          promise.then(() => {
            state.paused = false;
            updateControls();
          }).catch(() => {
            state.paused = true;
            updateControls();
            showToast("Браузер ждёт ручной запуск воспроизведения");
          });
        }
      }

      function showPlaybackError(kind) {
        const item = state.items[state.currentIndex];
        const failedElement = kind === "video" ? els.videoView : els.audioView;
        failedElement.hidden = true;
        els.errorState.hidden = false;
        els.errorState.innerHTML = `<strong>Файл не воспроизводится</strong>${escapeHtml(item ? item.name : "")}<br>${escapeHtml(kind === "video" ? "Этот формат или кодек может не поддерживаться браузером." : "Этот аудиоформат может не поддерживаться браузером.")}`;
        showToast("Не удалось воспроизвести файл");
      }

      function scrollActiveIntoView() {
        const active = els.playlist.querySelector(".playlist-item.active");
        if (active) active.scrollIntoView({ block: "nearest" });
      }

      function stopImageTimer() {
        window.clearTimeout(state.imageTimer);
        state.imageTimer = 0;
      }

      function startImageTimer() {
        stopImageTimer();
        if (!els.autoplayToggle.checked || state.paused || state.items.length <= 1) return;
        const seconds = Math.max(1, Math.min(120, Number(els.secondsInput.value) || 5));
        state.imageTimer = window.setTimeout(() => {
          goNext();
        }, seconds * 1000);
      }

      function goNext() {
        if (!state.items.length) return;
        if (!state.queue.length) buildQueue();
        if (state.detailGroupItemIds.length > 1) {
          const nextPosition = (state.detailGroupPosition + 1) % state.detailGroupItemIds.length;
          const nextId = state.detailGroupItemIds[nextPosition];
          const nextIndex = itemIndexById(nextId);
          if (nextIndex >= 0) {
            showItem(nextIndex, !state.paused);
            return;
          }
        }

        let nextPosition = state.queuePosition + 1;
        if (nextPosition >= state.queue.length) {
          nextPosition = 0;
        }

        showQueuePosition(nextPosition, !state.paused);
      }

      function goPrevious() {
        if (!state.items.length) return;
        if (!state.queue.length) buildQueue();
        if (state.detailGroupItemIds.length > 1) {
          const nextPosition = (state.detailGroupPosition - 1 + state.detailGroupItemIds.length) % state.detailGroupItemIds.length;
          const nextId = state.detailGroupItemIds[nextPosition];
          const nextIndex = itemIndexById(nextId);
          if (nextIndex >= 0) {
            showItem(nextIndex, !state.paused);
            return;
          }
        }

        let nextPosition = state.queuePosition - 1;
        if (nextPosition < 0) {
          nextPosition = state.queue.length - 1;
        }

        showQueuePosition(nextPosition, !state.paused, { preferLastInGroup: true });
      }

      function togglePlay() {
        if (!state.items.length) return;
        const item = state.items[state.currentIndex];
        if (!item) return;

        if (item.kind === "image") {
          state.paused = !state.paused;
          if (state.paused) stopImageTimer();
          else startImageTimer();
          updateControls();
          return;
        }

        const element = item.kind === "video" ? els.videoView : els.audioView;
        if (element.paused) {
          playMediaElement(element);
          state.paused = false;
        } else {
          element.pause();
          state.paused = true;
        }
        updateControls();
      }

      function selectPlaylistItem(index) {
        buildQueue(index);
        showItem(index, true);
      }

      function openFileAction(mode) {
        const item = state.items[state.currentIndex];
        if (!item || state.viewMode !== "single" || state.fileActionBusy) return;
        stopImageTimer();
        els.videoView.pause();
        els.audioView.pause();
        state.paused = true;
        updateControls();
        state.fileAction = { mode, itemId: item.id };
        const rename = mode === "rename";
        els.fileDialogTitle.textContent = rename ? "Переименовать файл" : "Удалить файл с диска?";
        els.fileDialogPath.textContent = item.path;
        els.fileNameInput.hidden = !rename;
        els.fileNameInput.value = item.name;
        els.fileDialogNote.textContent = rename
          ? "Теги и группа сохранятся. Расширение файла нужно оставить."
          : "Удаляется только этот файл, без корзины. Остальные файлы группы останутся.";
        if (!item.parentHandle) {
          els.fileDialogNote.textContent += " Выберите папку, в которой находится файл, когда браузер запросит доступ.";
        }
        els.confirmFileDialog.textContent = rename ? "Переименовать" : "Удалить с диска";
        els.fileDialogError.hidden = true;
        els.fileDialog.hidden = false;
        if (rename) {
          els.fileNameInput.focus();
          const dot = item.name.lastIndexOf(".");
          els.fileNameInput.setSelectionRange(0, dot > 0 ? dot : item.name.length);
        } else {
          els.cancelFileDialog.focus();
        }
      }

      function closeFileAction() {
        if (state.fileActionBusy) return;
        els.fileDialog.hidden = true;
        state.fileAction = null;
        if (state.viewMode === "single") els.renameFileButton.focus();
      }

      function validateFileName(name, item) {
        if (!name || /[<>:"/\\|?*\x00-\x1f]/.test(name) || /[. ]$/.test(name)
          || /^(con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\.|$)/i.test(name) || name.length > 255) {
          throw new Error("Введите допустимое имя файла Windows без символов <>:\"/\\|?* и точки или пробела в конце.");
        }
        if (fileExtension(name) !== fileExtension(item.name)) {
          throw new Error(`Сохраните расширение .${fileExtension(item.name)}.`);
        }
      }

      async function writableFileLocation(item) {
        if (!supportsDirectoryMemory()) {
          throw new Error("Для изменения файлов откройте просмотрщик в Chrome или Edge и выберите папку через + Папка.");
        }
        const parent = item.parentHandle || await window.showDirectoryPicker({ mode: "readwrite", id: "media-file-actions" });
        const permission = { mode: "readwrite" };
        if (await parent.queryPermission(permission) !== "granted"
          && await parent.requestPermission(permission) !== "granted") {
          throw new Error("Браузер не разрешил изменять файлы в этой папке.");
        }
        const handle = await parent.getFileHandle(item.name);
        const file = await handle.getFile();
        if (item.handle) {
          if (!await handle.isSameEntry(item.handle)) throw new Error("Выбрана другая папка. Выберите папку текущего файла.");
        } else if (file.size !== itemSize(item) || file.lastModified !== itemLastModified(item)) {
          throw new Error("Файл в выбранной папке не совпадает с открытым файлом или был изменён. Откройте папку заново.");
        }
        item.parentHandle = parent;
        item.handle = handle;
        item.record.parentHandle = parent;
        item.record.handle = handle;
        return { parent, handle, file };
      }

      async function renameOnDisk(location, newName) {
        const { parent, handle, file } = location;
        let existing;
        try {
          existing = await parent.getFileHandle(newName);
        } catch (error) {
          if (error.name !== "NotFoundError") throw error;
        }
        if (existing && !await existing.isSameEntry(handle)) {
          throw new Error("Файл с таким именем уже существует. Выберите другое имя.");
        }
        if (typeof handle.move === "function") {
          try {
            await handle.move(newName);
            return await parent.getFileHandle(newName);
          } catch (error) {
            if (error.name !== "NotSupportedError") throw error;
          }
        }
        if (existing) throw new Error("Браузер не поддерживает изменение только регистра букв. Выберите другое имя.");

        // External files cannot usually be moved by the browser. Commit the copy before removing the original.
        const destination = await parent.getFileHandle(newName, { create: true });
        try {
          const writable = await destination.createWritable();
          let copied = 0;
          let lastUpdate = 0;
          const progress = new TransformStream({
            transform(chunk, controller) {
              copied += chunk.byteLength;
              if (performance.now() - lastUpdate > 80 || copied === file.size) {
                updateLoading({ title: "Переименование", detail: newName, current: copied, total: file.size });
                lastUpdate = performance.now();
              }
              controller.enqueue(chunk);
            }
          });
          await file.stream().pipeThrough(progress).pipeTo(writable);
          const copy = await destination.getFile();
          if (copy.size !== file.size) throw new Error("Не удалось полностью записать файл. Исходный файл сохранён.");
          await parent.removeEntry(file.name);
          return destination;
        } catch (error) {
          try {
            await parent.removeEntry(newName);
          } catch {
            throw new Error(`Исходный файл сохранён, но не удалось убрать копию «${newName}». Проверьте папку перед повтором.`);
          }
          throw error;
        }
      }

      function releaseDiskItemMedia(item) {
        state.mediaLoadToken += 1;
        const card = state.galleryCards.get(item.id);
        if (card) unloadGalleryCard(card);
        revokeGalleryUrl(item.id);
        clearCurrentMedia();
      }

      function reconcileGalleryFiles(previousGroups) {
        const visible = visibleGalleryEntries();
        const visibleById = new Map(visible.map((entry) => [entry.item.id, entry]));
        const visibleByGroup = new Map(visible.map((entry) => [groupForItem(entry.item)?.id, entry]));
        for (const [id, card] of state.galleryCards) {
          let entry = visibleById.get(id);
          if (!entry) {
            const group = previousGroups.get(id);
            entry = group ? visibleByGroup.get(group.id)
              || group.itemIds.map((itemId) => visibleById.get(itemId)).find(Boolean) : null;
            state.galleryObserver?.unobserve(card);
            state.galleryCards.delete(id);
            if (!entry || state.galleryCards.has(entry.item.id)) {
              card.remove();
              continue;
            }
            card.outerHTML = renderGalleryCards([entry]);
            const replacement = els.galleryView.querySelector(`.gallery-card[data-id="${CSS.escape(entry.item.id)}"]`);
            state.galleryCards.set(entry.item.id, replacement);
            state.galleryObserver?.observe(replacement);
            continue;
          }
          card.dataset.index = String(entry.index);
          card.title = entry.item.path;
          card.querySelector(".gallery-title").textContent = entry.item.name;
          card.querySelector(".gallery-open").dataset.index = String(entry.index);
          card.querySelector(".gallery-select").dataset.selectIndex = String(entry.index);
          const videoButton = card.querySelector(".gallery-video-toggle");
          if (videoButton) videoButton.dataset.videoIndex = String(entry.index);
          const tagButton = card.querySelector(".gallery-tag-open");
          if (tagButton) tagButton.dataset.tagIndex = String(entry.index);
          const badge = card.querySelector(".gallery-group-count");
          if (badge) badge.outerHTML = galleryGroupBadgeHtml(entry.item);
        }
        state.galleryEntries = visible;
        state.galleryVisibleKey = galleryEntriesKey(visible);
        const firstMissing = visible.findIndex((entry) => !state.galleryCards.has(entry.item.id));
        state.galleryRenderedCount = firstMissing < 0 ? visible.length : firstMissing;
        state.galleryDirty = false;
        els.counter.textContent = `${visible.length} / ${state.items.length}`;
        refreshRenderedGalleryCards();
        if (!visible.length) els.galleryView.innerHTML = '<div class="gallery-empty">Ничего не найдено</div>';
      }

      async function applyDiskFileChange(item, newHandle) {
        const previousGroups = new Map(state.galleryEntries.map(({ item: entry }) => {
          const group = groupForItem(entry);
          return [entry.id, group ? { id: group.id, itemIds: [...group.itemIds] } : null];
        }));
        let targetId = item.id;
        if (newHandle) {
          const oldKey = tagKeyForItem(item);
          const newKey = fileNameTagKey(newHandle.name);
          const tags = state.fileTags[oldKey] || state.fileTags[item.id] || [];
          if (oldKey !== newKey) {
            state.fileTags[newKey] = Array.from(new Set([...(state.fileTags[newKey] || []), ...tags]));
            const sharedName = state.sourceRecords.some((record) => record !== item.record && fileNameTagKey(recordName(record)) === oldKey);
            if (!sharedName) delete state.fileTags[oldKey];
            state.groups.forEach((group) => {
              if ((group.itemIds || []).includes(item.id)) {
                group.keys = Array.from(new Set([...(group.keys || []).filter((key) => sharedName || key !== oldKey), newKey]));
              }
            });
          }
          const slash = item.path.lastIndexOf("/");
          item.name = newHandle.name;
          item.path = `${slash < 0 ? "" : item.path.slice(0, slash + 1)}${item.name}`;
          item.handle = newHandle;
          item.file = await newHandle.getFile();
          item.size = item.file.size;
          item.lastModified = item.file.lastModified;
          item.extension = fileExtension(item.name).toUpperCase();
          Object.assign(item.record, { id: item.id, name: item.name, path: item.path, handle: newHandle, file: item.file });
        } else {
          const groupIds = groupItemIdsForIndex(state.currentIndex);
          const position = groupIds.indexOf(item.id);
          const siblings = groupIds.filter((id) => id !== item.id);
          targetId = siblings[position % Math.max(1, siblings.length)]
            || state.items[state.queue[(state.queuePosition + 1) % state.queue.length]]?.id;
          if (targetId === item.id) targetId = null;
          state.sourceRecords = state.sourceRecords.filter((record) => record !== item.record);
          state.items = state.items.filter((entry) => entry.id !== item.id);
          state.gallerySelection.delete(item.id);
          state.galleryAspectRatios.delete(item.id);
          const key = tagKeyForItem(item);
          if (!state.sourceRecords.some((record) => fileNameTagKey(recordName(record)) === key)) {
            delete state.fileTags[key];
            state.groups.forEach((group) => { group.keys = (group.keys || []).filter((value) => value !== key); });
          }
        }
        state.itemIds = state.items.map((entry) => entry.id);
        state.itemIdSet = new Set(state.itemIds);
        state.itemEntryById = new Map(state.items.map((entry, index) => [entry.id, { item: entry, index }]));
        rebuildFolderTagIndex();
        state.autoTags = new Set(state.items.map(extensionTagForItem).filter(Boolean));
        pruneGroupsForItems();
        syncGalleryOrder();
        state.currentIndex = state.itemEntryById.get(targetId)?.index ?? (state.items.length ? 0 : -1);
        buildQueue(state.currentIndex);
        saveTagState();
        reconcileGalleryFiles(previousGroups);
        renderTagFilters();
        renderTagFilterPanel();
        els.status.textContent = `${folderName(state.sourceRecords)} · ${state.items.length} файлов`;
        if (state.currentIndex >= 0) {
          await showItem(state.currentIndex, false);
          const card = state.galleryCards.get(targetId);
          if (card) loadGalleryCard(card);
        } else {
          setViewMode("gallery");
          updateNowText();
          renderTags();
        }
      }

      async function confirmFileAction(event) {
        event.preventDefault();
        if (state.fileActionBusy || !state.fileAction) return;
        const action = state.fileAction;
        const item = state.itemEntryById.get(action.itemId)?.item;
        if (!item) { closeFileAction(); return; }
        let released = false;
        let diskCommitted = false;
        let finished = false;
        state.fileActionBusy = true;
        els.confirmFileDialog.disabled = true;
        els.fileDialogError.hidden = true;
        try {
          const newName = els.fileNameInput.value;
          if (action.mode === "rename") {
            validateFileName(newName, item);
            if (newName === item.name) { finished = true; return; }
          }
          const location = await writableFileLocation(item);
          startLoading(action.mode === "rename" ? "Переименование" : "Удаление файла", item.name);
          releaseDiskItemMedia(item);
          released = true;
          let handle = null;
          if (action.mode === "rename") handle = await renameOnDisk(location, newName);
          else await location.parent.removeEntry(item.name);
          diskCommitted = true;
          await applyDiskFileChange(item, handle);
          finished = true;
          showToast(action.mode === "rename" ? "Файл переименован" : "Файл удалён с диска");
        } catch (error) {
          if (released && !diskCommitted) {
            item.file = null;
            item.record.file = null;
            await showItem(state.currentIndex, false);
            const card = state.galleryCards.get(item.id);
            if (card) loadGalleryCard(card);
          }
          if (error.name !== "AbortError") {
            els.fileDialogError.textContent = diskCommitted
              ? "Файл изменён на диске, но обновить просмотрщик не удалось. Откройте папку заново."
              : error.message || "Не удалось изменить файл.";
            els.fileDialogError.hidden = false;
          }
          return;
        } finally {
          endLoading();
          state.fileActionBusy = false;
          els.confirmFileDialog.disabled = false;
          if (finished) closeFileAction();
        }
        closeFileAction();
      }

      async function removeItem(index) {
        const item = state.items[index];
        if (!item) return;

        const wasCurrent = index === state.currentIndex;
        const shouldPlay = !state.paused;
        const nextId = state.items[index + 1]?.id || state.items[index - 1]?.id;
        const currentId = state.items[state.currentIndex]?.id;
        state.sourceRecords = state.sourceRecords.filter((record) => (record.id || recordKey(record)) !== item.id);

        if (!state.sourceRecords.length) {
