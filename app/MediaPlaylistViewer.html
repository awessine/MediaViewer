<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Playlist Viewer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #141416;
      --panel: #1e1c20;
      --panel-2: #28252b;
      --panel-3: #363039;
      --text: #f4eff2;
      --muted: #aaa2aa;
      --line: #3b353e;
      --accent: #f484b5;
      --accent-2: #ffb7d4;
      --danger: #ff777e;
      --focus: rgba(255, 111, 181, 0.34);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      --zoom: 1;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    .folder-button,
    .file-button,
    select {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      min-height: 32px;
      border-radius: 6px;
      outline: none;
      font-size: 13px;
    }

    button,
    .folder-button,
    .file-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 10px;
      cursor: pointer;
      user-select: none;
      transition: background 150ms ease, border-color 150ms ease, transform 150ms ease;
    }

    button:hover,
    .folder-button:hover,
    .file-button:hover,
    select:hover {
      background: var(--panel-3);
      border-color: #655260;
    }

    button:active,
    .folder-button:active,
    .file-button:active {
      transform: translateY(1px);
    }

    button:focus-visible,
    .folder-button:focus-within,
    .file-button:focus-within,
    input:focus-visible,
    select:focus-visible {
      box-shadow: 0 0 0 3px var(--focus);
      border-color: var(--accent-2);
    }

    button[aria-pressed="true"] {
      background: rgba(255, 111, 181, 0.18);
      border-color: var(--accent);
      color: var(--accent-2);
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
      transform: none;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      height: 100vh;
      min-height: 0;
    }

    .sidebar {
      display: grid;
      grid-template-columns: 206px auto minmax(160px, 1fr);
      grid-template-areas:
        "brand source tools"
        "library library library"
        "tags tags tags";
      gap: 6px 18px;
      align-items: center;
      padding: 8px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      min-width: 0;
      min-height: 0;
      overflow: visible;
    }

    .brand {
      grid-area: brand;
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--accent);
      color: #210b1d;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: 15px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .status {
      min-height: 16px;
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .source-row,
    .mode-row,
    .sort-row,
    .playback-row {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .source-row {
      grid-area: source;
      grid-template-columns: repeat(2, max-content);
    }

    .mode-row {
      display: flex;
    }

    .sort-row {
      display: flex;
      align-items: center;
    }

    .playback-row {
      display: none;
      grid-template-columns: 1fr auto;
      align-items: center;
    }

    .hidden-input {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 32px;
      padding: 0 9px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }

    .toggle input {
      width: 14px;
      height: 14px;
      accent-color: var(--accent);
    }

    .toggle span {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    select {
      width: 100%;
      padding: 0 9px;
      cursor: pointer;
    }

    .seconds {
      width: 76px;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #241322;
      color: var(--text);
      padding: 0 8px;
    }

    .playlist-tools {
      grid-area: tools;
      display: grid;
      grid-template-columns: minmax(130px, 240px) auto;
      gap: 6px;
      align-items: center;
      min-width: 0;
    }

    .tags-section {
      display: grid;
      gap: 8px;
      min-height: 0;
    }

    .tag-filter-section {
      grid-area: tags;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 6px 8px;
      align-items: start;
      min-height: 0;
      min-width: 0;
    }

    .search {
      width: 100%;
      min-width: 0;
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #100710;
      color: var(--text);
      padding: 0 10px;
      outline: none;
    }

    .tag-editor {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 42px;
      gap: 8px;
    }

    .tag-input {
      width: 100%;
      min-width: 0;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #100710;
      color: var(--text);
      padding: 0 11px;
      outline: none;
    }

    .tags-panel,
    .tag-filter-panel,
    .tag-filters,
    .item-tags,
    .current-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }

    .tags-panel {
      max-height: 84px;
      overflow: auto;
      padding-right: 2px;
    }

    .tag-filters {
      min-height: 0;
    }

    .tag-filter-panel {
      max-height: 48px;
      overflow: auto;
      padding-right: 2px;
    }

    .filter-chip {
      min-height: 22px;
      max-width: 100%;
      border-radius: 999px;
      padding: 0 8px;
      background: rgba(255, 111, 181, 0.18);
      border-color: var(--accent);
      color: #fff1f8;
      font-size: 11px;
      white-space: nowrap;
    }

    .filter-tag {
      min-height: 22px;
      max-width: 100%;
      border-radius: 999px;
      padding: 0 7px;
      background: #2a1428;
      border-color: #5a2c50;
      color: #ffd2e9;
      font-size: 11px;
      white-space: nowrap;
    }

    .filter-tag.active {
      background: rgba(255, 111, 181, 0.24);
      border-color: var(--accent);
      color: #fff1f8;
    }

    .tag-picker-open {
      width: 32px;
      min-width: 32px;
      min-height: 26px;
      padding: 0;
      border-radius: 999px;
      font-weight: 700;
    }

    .clear-filters {
      min-height: 24px;
      border-radius: 999px;
      padding: 0 9px;
      color: var(--muted);
      font-size: 12px;
    }

    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 26px;
      max-width: 100%;
      border-radius: 999px;
      padding: 0 9px;
      background: #2a1428;
      border-color: #5a2c50;
      color: #ffd2e9;
      font-size: 12px;
      white-space: nowrap;
    }

    .tag-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tag-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff1f8;
      font-size: 11px;
      line-height: 1;
    }

    .tag-item {
      display: inline-flex;
      max-width: 100%;
      min-width: 0;
    }

    .tag-item .tag-chip {
      border-top-right-radius: 0;
      border-bottom-right-radius: 0;
      max-width: min(180px, 100%);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .delete-tag {
      min-width: 28px;
      min-height: 26px;
      padding: 0 8px;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
      border-left: 0;
      color: #ffd2e9;
      font-size: 13px;
    }

    .delete-tag:hover {
      border-color: var(--danger);
      background: rgba(255, 95, 142, 0.22);
      color: #fff;
    }

    .tag-chip.active {
      background: rgba(255, 111, 181, 0.24);
      border-color: var(--accent);
      color: #fff1f8;
    }

    .tag-chip.empty {
      color: var(--muted);
      cursor: default;
    }

    .counter {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .playlist {
      display: none;
      min-height: 0;
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #100710;
    }

    .playlist-more {
      width: 100%;
      min-height: 32px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      pointer-events: none;
    }

    .playlist-empty {
      display: grid;
      place-items: center;
      min-height: 180px;
      padding: 24px;
      color: var(--muted);
      text-align: center;
      line-height: 1.45;
    }

    .playlist-item {
      width: 100%;
      min-height: 58px;
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      padding: 9px 10px;
      border: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.055);
      border-radius: 0;
      background: transparent;
      text-align: left;
      color: var(--text);
    }

    .playlist-item:hover {
      background: #241322;
    }

    .playlist-item.active {
      background: rgba(255, 111, 181, 0.14);
      box-shadow: inset 3px 0 0 var(--accent-2);
    }

    .playlist-item:last-child {
      border-bottom: 0;
    }

    .type-badge {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #33172f;
      color: var(--accent);
      font-size: 17px;
    }

    .item-main,
    .now-text {
      min-width: 0;
    }

    .select-item {
      display: block;
      width: 100%;
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      text-align: left;
    }

    .select-item:hover {
      background: transparent;
      border-color: transparent;
    }

    .item-name,
    .now-title {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-sub,
    .now-sub {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-size {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .item-tags {
      margin-top: 6px;
    }

    .mini-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: 118px;
      min-height: 20px;
      padding: 0 7px;
      border: 1px solid rgba(255, 111, 181, 0.34);
      border-radius: 999px;
      background: rgba(255, 111, 181, 0.14);
      color: #ffd2e9;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-tag.active {
      background: rgba(255, 111, 181, 0.34);
      border-color: var(--accent);
      color: #fff1f8;
    }

    .remove-item {
      width: 34px;
      min-width: 34px;
      min-height: 34px;
      padding: 0;
      color: #ffd2e9;
    }

    .remove-item:hover {
      border-color: var(--danger);
      color: #fff;
      background: rgba(255, 95, 142, 0.2);
    }

    .player {
      display: grid;
      grid-row: 2;
      grid-template-rows: minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--bg);
    }

    .stage-frame {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .stage {
      position: relative;
      display: block;
      min-width: 0;
      min-height: 0;
      height: 100%;
      overflow: auto;
      scrollbar-gutter: stable;
      outline: none;
      scroll-padding-top: 64px;
      scrollbar-color: #70335f #120912;
    }

    .stage.dragging {
      box-shadow: inset 0 0 0 3px var(--accent-2);
      background: rgba(255, 111, 181, 0.08);
    }

    .empty-state,
    .error-state {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(560px, calc(100% - 36px));
      max-width: 560px;
      padding: 28px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
      z-index: 2;
    }

    .empty-state strong,
    .error-state strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .media-layer {
      position: relative;
      min-width: 100%;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .detail-overlay {
      position: absolute;
      inset: 0;
      z-index: 7;
      background: rgba(3, 1, 3, 0.68);
    }

    .detail-overlay .media-layer {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 8;
      width: fit-content;
      height: fit-content;
      max-width: calc(100% - 24px);
      max-height: calc(100% - 24px);
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      overflow: hidden;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255, 111, 181, 0.28);
      border-radius: 8px;
      background: rgba(9, 4, 8, 0.94);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(14px);
    }

    .detail-overlay .media-layer.scrollable {
      inset: 12px;
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      overflow: auto;
      transform: none;
    }

    .media-layer.scrollable {
      align-items: flex-start;
      justify-content: flex-start;
    }

    .detail-info {
      display: none;
      width: 100%;
      max-width: min(720px, calc(100vw - 56px));
      gap: 8px;
      min-width: 0;
      flex: 0 0 auto;
      padding: 2px 2px 0;
    }

    .detail-overlay .detail-info {
      display: grid;
    }

    .detail-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .detail-heading .detail-title {
      flex: 1;
    }

    .detail-file-actions {
      display: flex;
      gap: 4px;
      flex: 0 0 auto;
    }

    .detail-file-actions button {
      min-width: 26px;
      min-height: 26px;
      padding: 2px 6px;
    }

    .detail-title {
      min-width: 0;
      overflow: hidden;
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 24px;
      min-width: 0;
      max-height: 90px;
      overflow: auto;
    }

    .detail-tags .tag-chip {
      min-width: 0;
      max-width: 100%;
    }

    .detail-tags .tag-picker-open {
      width: 26px;
      min-width: 26px;
      min-height: 22px;
      margin-left: 0;
    }

    .detail-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      min-height: 14px;
      min-width: 0;
      max-width: 100%;
    }

    .detail-page-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      min-width: 0;
    }

    .detail-page-gap {
      color: var(--muted);
      font-size: 12px;
    }

    .detail-page-count {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .detail-page-count input {
      width: 64px;
      min-width: 0;
      min-height: 24px;
      padding: 2px 4px;
      text-align: right;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
    }

    .detail-dot {
      flex: 0 0 8px;
      height: 8px;
      width: 8px;
      min-width: 8px;
      min-height: 8px;
      padding: 0;
      border-radius: 999px;
      border-color: rgba(255, 210, 233, 0.42);
      background: rgba(255, 210, 233, 0.22);
      box-shadow: none;
    }

    .detail-dot.active {
      border-color: var(--accent);
      background: var(--accent);
    }

    .detail-nav {
      position: absolute;
      top: 50%;
      z-index: 9;
      display: none;
      place-items: center;
      width: 44px;
      min-width: 44px;
      min-height: 54px;
      padding: 0;
      border-radius: 999px;
      background: rgba(16, 7, 16, 0.72);
      color: #fff1f8;
      font-size: 34px;
      font-weight: 600;
      transform: none;
    }

    .detail-overlay .detail-nav {
      display: grid;
    }

    .detail-nav:hover {
      transform: none;
    }

    .detail-nav-prev {
      left: max(14px, calc(50% - min(50vw, 620px)));
    }

    .detail-nav-next {
      right: max(14px, calc(50% - min(50vw, 620px)));
    }

    .media {
      display: block;
      flex: 0 0 auto;
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      object-fit: contain;
      outline: none;
    }

    .media.cover {
      object-fit: cover;
    }

    .media.original {
      width: auto;
      height: auto;
      max-width: none;
      max-height: none;
      object-fit: none;
    }

    .gallery-view {
      width: 100%;
      min-height: 100%;
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      align-items: start;
      gap: 14px;
      overflow: visible;
    }

    .gallery-column {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 14px;
    }

    .gallery-card {
      position: relative;
      display: block;
      width: 100%;
      margin: 0;
      scroll-margin-top: 72px;
      border: 1px solid rgba(255, 111, 181, 0.16);
      border-radius: 8px;
      background: rgba(28, 15, 27, 0.86);
      overflow: hidden;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.22);
    }

    .gallery-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(255, 111, 181, 0.26), 0 12px 34px rgba(0, 0, 0, 0.26);
    }

    .gallery-card.selected {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 2px rgba(255, 173, 216, 0.28), 0 12px 34px rgba(0, 0, 0, 0.26);
    }

    .gallery-bulkbar {
      position: sticky;
      top: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 44px;
      padding: 8px 14px 0;
      background: linear-gradient(180deg, rgba(9, 4, 8, 0.98), rgba(9, 4, 8, 0.72));
      backdrop-filter: blur(10px);
    }

    .gallery-folder-filter {
      margin-left: auto;
      font-size: 12px;
      min-height: 30px;
      flex: 0 0 auto;
    }

    .gallery-bulk-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 30px;
      min-height: 26px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #ffd2e9;
      font-size: 12px;
      font-weight: 700;
    }

    .gallery-action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 86px;
      min-height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      color: #ffd2e9;
      font-size: 13px;
      font-weight: 800;

<body>
  <div class="app">
    <aside class="sidebar" aria-label="Медиатека">
      <header class="brand">
        <div class="mark" aria-hidden="true">MP</div>
        <div>

          <div class="status" id="status">Папка не выбрана</div>
        </div>

      <section class="source-row" aria-label="Источник">
        <label class="folder-button" id="folderButton" title="Открыть и запомнить папку">
          <input class="hidden-input" id="folderInput" type="file" webkitdirectory directory multiple>
          <span data-icon="FolderOpen" aria-hidden="true"></span>
          <span class="button-label">Открыть папку</span>
        </label>
        <label class="file-button" title="Открыть файлы">
          <input class="hidden-input" id="filesInput" type="file" multiple>
          <span data-icon="FilePlus2" aria-hidden="true"></span>
          <span class="button-label">Добавить файлы</span>
        </label>
      </section>

      <section class="playlist-tools" aria-label="Поиск">
        <div class="search-field">
          <span data-icon="Search" aria-hidden="true"></span>
          <input class="search" id="searchInput" type="search" placeholder="Поиск по имени или папке" aria-label="Поиск по имени или папке" autocomplete="off">
        </div>
      </section>

      <section class="library-toolbar" aria-label="Параметры медиатеки">
      <section class="mode-row" aria-label="Режим">
        <label class="toggle" title="Включить подпапки">
          <input id="subfoldersToggle" type="checkbox" checked>
          <span>Подпапки</span>
        </label>
        <label class="toggle" title="Случайный порядок" hidden>
          <input id="shuffleToggle" type="checkbox" checked>
          <span>Случайный порядок</span>
        </label>
      </section>

      <section class="playback-row" aria-label="Автопереход" hidden>
        <label class="toggle" title="Автопереход">
          <input id="autoplayToggle" type="checkbox">
          <span>Автопереход</span>
        </label>
        <input class="seconds" id="secondsInput" type="number" min="1" max="120" step="1" value="5" aria-label="Секунд на фото">
      </section>

      <section class="sort-row" aria-label="Сортировка">
        <span class="toolbar-caption"><span data-icon="ArrowDownWideNarrow" aria-hidden="true"></span>Сортировка</span>
        <select id="sortSelect" aria-label="Сортировка">
          <option value="random" selected>Случайно</option>
          <option value="name">Имя</option>
          <option value="date">Дата</option>
          <option value="type">Тип</option>
          <option value="size">Размер</option>
        </select>
      </section>
      <label class="toggle gallery-folder-filter" title="Только группы с несколькими страницами"><input id="multipageToggle" type="checkbox"><span>Многостраничные</span></label>
      <button id="gallerySelectToggle" type="button" title="Выбор файлов" aria-label="Выбор файлов" aria-pressed="false"><span data-icon="SquareCheck" aria-hidden="true"></span><span>Выбрать</span></button>
      <button id="autoTagButton" type="button" title="Правила автоматической простановки тегов"><span data-icon="WandSparkles" aria-hidden="true"></span><span>Автотеги</span></button>
      </section>

      <section class="tag-filter-section" aria-label="Отбор по тегам">
        <span class="filter-caption" title="Совпадение по всем выбранным тегам"><span data-icon="Tags" aria-hidden="true"></span><span>Теги</span></span>
        <div class="tag-filters" id="tagFilters" aria-label="Активные фильтры тегов"></div>
        <div class="tag-filter-panel" id="tagFilterPanel" aria-label="Теги для отбора"></div>
      </section>

      <div class="playlist" id="playlist" role="listbox" aria-label="Файлы">
        <div class="playlist-empty">Откройте папку или перетащите файлы сюда</div>
      </div>
    </aside>

    <main class="player">
      <div class="stage-frame" id="stageFrame">
      <section class="stage" id="stage" tabindex="0" aria-label="Просмотр">
        <div class="empty-state" id="emptyState">
          <span class="empty-icon" data-icon="Images" aria-hidden="true"></span>
          <strong>Откройте папку</strong>
        </div>
        <div class="gallery-bulkbar" id="galleryBulkBar" hidden>
          <div class="selection-actions" id="selectionActions" hidden>
          <span class="gallery-bulk-count" id="gallerySelectionCount" aria-live="polite" title="Выбрано файлов">0</span>
          <button class="gallery-action-button" id="galleryGroupButton" type="button" title="Сгруппировать выбранные" aria-label="Сгруппировать выбранные" disabled>Группа</button>

          <button class="icon-button" id="galleryClearSelection" type="button" title="Снять выбор" aria-label="Снять выбор" disabled><span data-icon="X" aria-hidden="true"></span></button>
          </div>
        </div>
        <div class="gallery-view" id="galleryView" aria-label="Плитка файлов" hidden></div>
        <div class="drop-hint">Отпустите файлы</div>
      </section>
      <div class="detail-overlay" id="detailOverlay" role="dialog" aria-label="Подробный просмотр" hidden>

          <img class="media" id="imageView" alt="" hidden>
          <video class="media" id="videoView" controls playsinline hidden></video>
          <audio class="media" id="audioView" controls hidden></audio>
          <div class="detail-info" id="detailInfo" hidden>
            <div class="detail-heading">
              <div class="detail-title" id="detailTitle"></div>
              <div class="detail-file-actions">
                <button id="renameFileButton" type="button" title="Переименовать файл на диске (F2)" aria-label="Переименовать файл на диске"><span data-icon="Pencil" aria-hidden="true"></span></button>
                <button id="deleteFileButton" type="button" title="Удалить файл с диска" aria-label="Удалить файл с диска"><span data-icon="Trash2" aria-hidden="true"></span></button>
              </div>

            <div class="detail-tags" id="detailTags"></div>
            <div class="detail-dots" id="detailDots" aria-label="Группа файлов"></div>

        <button class="detail-nav detail-nav-next" id="detailNextButton" type="button" title="Дальше" aria-label="Дальше" disabled><span data-icon="ChevronRight" aria-hidden="true"></span></button>
      </div>
      </div>

      <footer class="bottom-bar">
        <button class="icon-button" id="galleryToggle" type="button" title="Назад к плитке" aria-label="Назад к плитке" hidden><span data-icon="ArrowLeft" aria-hidden="true"></span></button>
        <section class="tags-section bottom-tags" aria-label="Теги">
          <div class="tag-editor">
            <input class="tag-input" id="tagInput" type="text" placeholder="Новый тег" aria-label="Новый тег" autocomplete="off">
            <button class="icon-button" id="addTagButton" type="button" title="Создать тег и добавить к выбранному файлу" aria-label="Создать тег"><span data-icon="Plus" aria-hidden="true"></span></button>
          </div>
          <div class="tags-panel" id="tagsPanel" aria-label="Теги текущего файла"></div>
        </section>

        <div class="transport" aria-label="Управление">
          <button class="icon-button" id="prevButton" type="button" title="Назад" aria-label="Назад" disabled>‹</button>
          <button class="play-button" id="playButton" type="button" title="Пуск / пауза" aria-label="Пуск / пауза" disabled>▶</button>
          <button class="icon-button" id="nextButton" type="button" title="Дальше" aria-label="Дальше" disabled>›</button>

      function loadTagState() {
        try {
          state.tags = JSON.parse(localStorage.getItem(tagKeys.tags) || "[]");
          state.fileTags = JSON.parse(localStorage.getItem(tagKeys.fileTags) || localStorage.getItem(tagKeys.legacyFileTags) || "{}");
          state.groups = normalizeStoredGroups(JSON.parse(localStorage.getItem(tagKeys.groups) || "[]"));
          state.disabledAutoGroupKeys = new Set(JSON.parse(localStorage.getItem(tagKeys.disabledAutoGroups) || "[]"));
        } catch {
          state.tags = [];
          state.fileTags = {};
          state.groups = [];
          state.disabledAutoGroupKeys = new Set();
        }
        rebuildGroupIndex();
        loadAutoTagState();
      }

      function saveTagState() {
        invalidateAutoTagPreview();

        localStorage.setItem(tagKeys.disabledAutoGroups, JSON.stringify(Array.from(state.disabledAutoGroupKeys)));
      }

      function normalizeRuleText(value) {
        return (String(value || "").normalize("NFKC")
          .replace(/([a-zа-яё])([A-ZА-ЯЁ])/g, "$1 $2")
          .toLocaleLowerCase("ru").replace(/ё/g, "е")
          .match(/[\p{L}\p{N}]+/gu) || []).join(" ");
      }

      function newTagRule(tag, terms = [tag]) {
        return { id: crypto.randomUUID(), tag, terms, source: "both", match: "words", enabled: true };
      }

      function saveAutoTagState() {
        clearTimeout(state.autoTagSaveTimer);
        localStorage.setItem(autoTagKeys.rules, JSON.stringify(state.tagRules));
        localStorage.setItem(autoTagKeys.seeded, JSON.stringify([...state.tagRulesSeeded]));
        localStorage.setItem(autoTagKeys.automatic, JSON.stringify(state.autoTagNewFiles));
      }

      function seedAutoTagRules(explicit = false) {
        let count = 0;
        state.tags.forEach((tag) => {
          if (!tag || tag.startsWith(".") || (!explicit && state.tagRulesSeeded.has(tag))) return;
          if (!state.tagRules.some((rule) => rule.tag === tag)) {
            state.tagRules.push(newTagRule(tag));
            count += 1;
          }
          state.tagRulesSeeded.add(tag);
        });
        if (count) {
          try { saveAutoTagState(); }
          catch { showToast("Не удалось сохранить правила автотегов"); }
        }
        return count;
      }

      function loadAutoTagState() {
        try {
          const rules = JSON.parse(localStorage.getItem(autoTagKeys.rules) || "[]");
          state.tagRules = Array.isArray(rules) ? rules.filter((rule) => rule && state.tags.includes(rule.tag)).map((rule) => ({
            ...newTagRule(rule.tag), ...rule,
            terms: Array.isArray(rule.terms) ? rule.terms.filter((term) => typeof term === "string") : [],
            source: ["name", "folder", "both"].includes(rule.source) ? rule.source : "both",
            match: ["words", "contains", "exact"].includes(rule.match) ? rule.match : "words"
          })) : [];
          state.tagRulesSeeded = new Set(JSON.parse(localStorage.getItem(autoTagKeys.seeded) || "[]"));
          state.autoTagNewFiles = JSON.parse(localStorage.getItem(autoTagKeys.automatic) || "true") !== false;
          const undo = JSON.parse(localStorage.getItem(autoTagKeys.undo) || "null");
          state.autoTagUndo = Array.isArray(undo) ? undo.filter((entry) => typeof entry?.key === "string" && Array.isArray(entry.before) && Array.isArray(entry.after)) : null;
        } catch {
          state.tagRules = [];
          state.tagRulesSeeded = new Set();
          state.autoTagUndo = null;
        }
        seedAutoTagRules();
      }

      function invalidateAutoTagPreview() {
        if (state.autoTagTask) state.autoTagTask.cancelled = true;
        state.autoTagPreview = null;
        els.applyAutoTags.disabled = true;
        if (!els.autoTagDialog.hidden && !state.autoTagTask) {
          els.autoTagSummary.textContent = `${state.tagRules.length} правил · ${state.items.length} файлов`;
          els.autoTagResults.textContent = "";
        }
      }

      function compiledTagRules() {
        const knownTags = new Set(state.tags);
        return state.tagRules.filter((rule) => rule.enabled && knownTags.has(rule.tag)).map((rule) => ({
          ...rule, terms: Array.from(new Set(rule.terms.map(normalizeRuleText).filter(Boolean)))
        })).filter((rule) => rule.terms.length);
      }

      function ruleFieldsForItem(item) {
        const cached = state.autoTagFields.get(item);
        if (cached?.path === item.path && cached?.name === item.name) return cached;
        const dot = item.name.lastIndexOf(".");
        const fields = {
          path: item.path, name: item.name,
          filename: normalizeRuleText(dot > 0 ? item.name.slice(0, dot) : item.name),
          folders: normalizePath(item.path).split("/").slice(0, -1).map(normalizeRuleText)
        };
        state.autoTagFields.set(item, fields);
        return fields;
      }

      function tagRuleMatches(rule, fields) {
        const values = rule.source === "name" ? [fields.filename]
          : rule.source === "folder" ? fields.folders : [fields.filename, ...fields.folders];
        return values.some((value) => rule.terms.some((term) => {
          if (rule.match === "exact") return value === term;
          if (rule.match === "contains") return value.includes(term);
          return ` ${value} `.includes(` ${term} `);
        }));
      }

      async function collectAutoTagChanges(items, task, progress) {
        const allItems = state.items;
        const rules = compiledTagRules();
        const desired = new Map();
        const total = items.length + state.items.length * 2;
        let done = 0;
        const tick = async () => {
          done += 1;
          if (done % 200 === 0 || done === total) {
            progress?.(done, total);
            await yieldToBrowser();
          }
          return !task?.cancelled && state.items === allItems;
        };
        if (!rules.length) return { items: state.items, rows: [], changes: [] };
        for (const item of items) {
          const fields = ruleFieldsForItem(item);
          const key = tagAssignmentKeyForItem(item);
          for (const rule of rules) {
            if (!tagRuleMatches(rule, fields)) continue;
            if (!desired.has(key)) desired.set(key, new Set());
            desired.get(key).add(rule.tag);
          }
          if (!await tick()) return null;
        }
        const changes = new Map();
        // Preview every page affected by shared folder tags, or by shared filenames outside folders.
        for (const item of state.items) {
          const key = tagAssignmentKeyForItem(item);
          if (desired.has(key)) {
            if (!changes.has(key)) changes.set(key, { key, before: new Set(), added: [...desired.get(key)] });
            manualItemTags(item).forEach((tag) => changes.get(key).before.add(tag));
          }
          if (!await tick()) return null;
        }
        for (const [key, change] of changes) {
          change.added = change.added.filter((tag) => !change.before.has(tag));
          if (!change.added.length) { changes.delete(key); continue; }
          change.before = [...change.before];
          change.after = Array.from(new Set([...change.before, ...change.added]));
        }
        const rows = [];
        for (const item of state.items) {
          const change = changes.get(tagAssignmentKeyForItem(item));
          if (change) rows.push({ id: item.id, name: item.name, path: item.path, tags: change.added });
          if (!await tick()) return null;
        }
        progress?.(total, total);
        return { items: state.items, rows, changes: [...changes.values()] };
      }

      function persistAutoTagChanges(changes, rememberUndo = true) {
        if (!changes.length) return;
        const next = { ...state.fileTags };
        changes.forEach(({ key, after }) => {
          if (after.length || isFolderTagKey(key)) next[key] = after;
          else delete next[key];
        });
        localStorage.setItem(tagKeys.fileTags, JSON.stringify(next));
        state.fileTags = next;
        state.tagUsageCounts = null;
        state.items.forEach((item) => { item.tags = manualItemTags(item); });
        state.autoTagUndo = rememberUndo ? changes.map(({ key, before, after }) => ({ key, before, after })) : null;
        try {
          localStorage.setItem(autoTagKeys.undo, JSON.stringify(state.autoTagUndo));
        } catch {
          showToast("Теги сохранены, но историю отмены не удалось сохранить");
        }
      }

      async function autoTagImportedItems(items) {
        const result = await collectAutoTagChanges(items, null, (current, total) => {
          updateLoading({ title: "Автотеги", current, total });
        });
        if (result) {
          try { persistAutoTagChanges(result.changes); }
          catch { showToast("Файлы открыты, но автотеги не удалось сохранить"); }
        }
      }

      function autoTagTargetItems() {
        if (els.autoTagScope.value === "selection") return selectedGalleryItems();
        if (els.autoTagScope.value === "current") return state.items[state.currentIndex] ? [state.items[state.currentIndex]] : [];
        return state.items;
      }

      function renderAutoTagRules() {
        const tags = sortedTags(state.tags);
        const rank = new Map(tags.map((tag, index) => [tag, index]));
        const options = (values, selected) => values.map(([value, label]) => `<option value="${escapeHtml(value)}"${value === selected ? " selected" : ""}>${escapeHtml(label)}</option>`).join("");
        els.autoTagRuleList.innerHTML = [...state.tagRules]
          .sort((a, b) => (rank.get(a.tag) ?? Infinity) - (rank.get(b.tag) ?? Infinity))
          .map((rule) => `<div class="auto-rule-row" data-rule-id="${escapeHtml(rule.id)}">
            <input type="checkbox" data-rule-field="enabled" aria-label="Правило ${escapeHtml(rule.tag)} включено"${rule.enabled ? " checked" : ""}>
            <select data-rule-field="tag" aria-label="Тег">${options(tags.map((tag) => [tag, tag]), rule.tag)}</select>
            <select data-rule-field="source" aria-label="Где искать">${options([["both", "Имя и папки"], ["name", "Имя файла"], ["folder", "Папки"]], rule.source)}</select>
            <select data-rule-field="match" aria-label="Совпадение">${options([["words", "Слова / фразы"], ["contains", "Часть текста"], ["exact", "Точное имя"]], rule.match)}</select>
            <textarea data-rule-field="terms" aria-label="Ключевые слова через запятую" placeholder="Слова, синонимы">${escapeHtml(rule.terms.join(", "))}</textarea>
            <button type="button" class="icon-button" data-delete-rule title="Удалить правило" aria-label="Удалить правило ${escapeHtml(rule.tag)}">×</button>
          </div>`).join("") || '<div class="auto-tag-summary">Нет правил</div>';
      }

      function selectAutoTagTab(preview) {
        els.autoTagRulesTab.setAttribute("aria-selected", String(!preview));
        els.autoTagPreviewTab.setAttribute("aria-selected", String(preview));
        els.autoTagRuleList.hidden = preview;
        els.autoTagResults.hidden = !preview;
      }

      function renderAutoTagPreview() {
        const preview = state.autoTagPreview;
        if (!preview) {
          els.autoTagResults.textContent = "Предпросмотр ещё не выполнен";
          return;
        }
        els.autoTagResults.innerHTML = preview.rows.slice(0, state.autoTagPreviewCount).map((row) => `
          <div class="auto-tag-result" data-preview-id="${escapeHtml(row.id)}">
            <div><div class="auto-tag-result-name">${escapeHtml(row.name)}</div><div class="auto-tag-result-path">${escapeHtml(row.path)}</div></div>
            <div class="auto-tag-result-tags">${sortedTags(row.tags).map((tag) => `<span class="mini-tag">+ ${escapeHtml(tag)}</span>`).join("")}</div>
          </div>`).join("") || '<div class="auto-tag-summary">Новых совпадений нет</div>';
        if (preview.rows.length > state.autoTagPreviewCount) {
          els.autoTagResults.insertAdjacentHTML("beforeend", `<button type="button" data-more-preview>Ещё 100 (${Math.min(state.autoTagPreviewCount, preview.rows.length)} / ${preview.rows.length})</button>`);
        }
        const additions = preview.rows.reduce((count, row) => count + row.tags.length, 0);
        els.autoTagSummary.textContent = `${preview.rows.length} файлов · ${additions} новых тегов`;
        els.applyAutoTags.disabled = !preview.changes.length;
      }

      function saveAutoTagRulesSoon() {
        clearTimeout(state.autoTagSaveTimer);
        state.autoTagSaveTimer = setTimeout(() => {
          try { saveAutoTagState(); }
          catch { showToast("Не удалось сохранить правила автотегов"); }
        }, 200);
      }

      function editAutoTagRule(event) {
        const field = event.target.dataset.ruleField;
        const row = event.target.closest("[data-rule-id]");
        const rule = row && state.tagRules.find((entry) => entry.id === row.dataset.ruleId);
        if (!rule || !field || state.autoTagTask) return;
        rule[field] = field === "enabled" ? event.target.checked : field === "terms"
          ? event.target.value.split(/[,;\n]+/).map((term) => term.trim()).filter(Boolean) : event.target.value;
        invalidateAutoTagPreview();
        saveAutoTagRulesSoon();
      }

      function openAutoTagDialog() {
        seedAutoTagRules();
        renderAutoTagRules();
        els.autoTagNewFiles.checked = state.autoTagNewFiles;
        els.autoTagScope.value = state.viewMode === "single" ? "current" : state.gallerySelection.size ? "selection" : "all";
        els.autoTagScope.querySelector('[value="selection"]').disabled = !state.gallerySelection.size;
        els.autoTagScope.querySelector('[value="current"]').disabled = state.currentIndex < 0;
        els.undoAutoTags.disabled = !state.autoTagUndo?.length;
        selectAutoTagTab(false);
        els.autoTagDialog.hidden = false;
        invalidateAutoTagPreview();
        els.closeAutoTagDialog.focus();
      }

      function closeAutoTagDialog() {
        if (state.autoTagTask) state.autoTagTask.cancelled = true;
        try { saveAutoTagState(); }
        catch { showToast("Не удалось сохранить правила автотегов"); }
        els.autoTagDialog.hidden = true;
        els.autoTagButton.focus();
      }

      function updateAutoTagProgress(current, total, title) {
        const percent = total ? Math.round(current * 100 / total) : 0;
        els.autoTagProgressBar.value = percent;
        els.autoTagProgressLabel.textContent = `${title} · ${percent}% (${current} / ${total})`;
      }

      async function runAutoTagTask(title, operation) {
        if (state.autoTagTask) return;
        const task = { cancelled: false };
        state.autoTagTask = task;
        const controls = [...els.autoTagDialog.querySelectorAll("input, select, textarea, button")]
          .filter((control) => ![els.cancelAutoTagTask, els.closeAutoTagDialog].includes(control));
        const disabled = controls.map((control) => control.disabled);
        controls.forEach((control) => { control.disabled = true; });
        els.autoTagProgress.hidden = false;
        updateAutoTagProgress(0, 0, title);
        try {
          await yieldToBrowser();
          await operation(task, (current, total) => updateAutoTagProgress(current, total, title));
          if (task.cancelled) els.autoTagSummary.textContent = "Операция отменена, теги не изменены";
        } catch (error) {
          els.autoTagSummary.textContent = "Не удалось выполнить операцию. Теги не изменены";
          showToast("Не удалось сохранить автотеги или правила");
        } finally {
          state.autoTagTask = null;
          els.autoTagProgress.hidden = true;
          controls.forEach((control, index) => { control.disabled = disabled[index]; });
          els.applyAutoTags.disabled = !state.autoTagPreview?.changes.length;
          els.undoAutoTags.disabled = !state.autoTagUndo?.length;
        }
      }

      async function previewAutoTags() {
        await runAutoTagTask("Проверка имён и папок", async (task, progress) => {
          saveAutoTagState();
          const preview = await collectAutoTagChanges(autoTagTargetItems(), task, progress);
          if (!preview || task.cancelled) return;
          state.autoTagPreview = preview;
          state.autoTagPreviewCount = 100;
          renderAutoTagPreview();
          selectAutoTagTab(true);
          els.autoTagContent.scrollTop = 0;
        });
      }

      function refreshAutoTaggedViews() {
        renderTags();
        renderTagFilters();
        renderTagFilterPanel();
        if (state.tagFilters.length) renderPlaylist();
        else refreshRenderedGalleryCards();
      }

      async function applyAutoTags() {
        const preview = state.autoTagPreview;
        if (!preview?.changes.length || preview.items !== state.items) { invalidateAutoTagPreview(); return; }
        await runAutoTagTask("Простановка тегов", async (task, progress) => {
          const changes = [];
          for (let index = 0; index < preview.changes.length; index += 1) {
            const entry = preview.changes[index];
            const before = Array.from(new Set(state.fileTags[entry.key] || entry.before));
            const added = entry.added.filter((tag) => state.tags.includes(tag) && !before.includes(tag));
            if (added.length) changes.push({ key: entry.key, before, after: [...before, ...added] });
            if ((index + 1) % 200 === 0 || index + 1 === preview.changes.length) {
              progress(index + 1, preview.changes.length);
              await yieldToBrowser();
            }
            if (task.cancelled || preview.items !== state.items) return;
          }
          persistAutoTagChanges(changes);
          state.autoTagPreview = null;
          refreshAutoTaggedViews();
          els.autoTagSummary.textContent = `Готово: теги добавлены для ${preview.rows.length} файлов`;
          els.autoTagResults.textContent = "Теги сохранены";
        });
      }

      async function undoAutoTags() {
        const undo = state.autoTagUndo;
        if (!undo?.length) return;
        await runAutoTagTask("Отмена простановки", async (task, progress) => {
          const changes = [];
          let skipped = 0;
          for (let index = 0; index < undo.length; index += 1) {
            const entry = undo[index];
            const current = state.fileTags[entry.key] || [];
            if (current.length === entry.after.length && entry.after.every((tag) => current.includes(tag))) {
              changes.push({ key: entry.key, before: current, after: entry.before.filter((tag) => state.tags.includes(tag)) });
            } else skipped += 1;
            if ((index + 1) % 200 === 0 || index + 1 === undo.length) {
              progress(index + 1, undo.length);
              await yieldToBrowser();
            }
            if (task.cancelled) return;
          }
          persistAutoTagChanges(changes, false);
          state.autoTagUndo = null;
          try { localStorage.removeItem(autoTagKeys.undo); } catch { /* Tag data is already saved. */ }
          state.autoTagPreview = null;
          refreshAutoTaggedViews();
          els.autoTagSummary.textContent = `Отменено: ${changes.length} имён${skipped ? ` · пропущено изменённых вручную: ${skipped}` : ""}`;
          els.autoTagResults.textContent = "Результат отменён";
        });
      }

      function supportsDirectoryMemory() {
        return window.isSecureContext && "showDirectoryPicker" in window && "indexedDB" in window;
      }

      function openFolderDb() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(folderMemory.db, 1);
          request.onupgradeneeded = () => {
            request.result.createObjectStore(folderMemory.store);
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      async function folderStoreRequest(type, value) {
        const db = await openFolderDb();
        return new Promise((resolve, reject) => {
          const transaction = db.transaction(folderMemory.store, type === "get" ? "readonly" : "readwrite");
          const store = transaction.objectStore(folderMemory.store);
          const request = type === "get" ? store.get(folderMemory.key) : store.put(value, folderMemory.key);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
          transaction.oncomplete = () => db.close();
          transaction.onerror = () => {
            db.close();
            reject(transaction.error);
          };
        });
      }

      async function saveRememberedDirectoryHandle(handle) {
        if (!supportsDirectoryMemory()) return false;
        try {
          await folderStoreRequest("put", handle);
          state.rememberedDirectoryHandle = handle;
          return true;
        } catch {
          return false;
        }
      }

      async function getRememberedDirectoryHandle() {
        if (!supportsDirectoryMemory()) return null;
        try {
          return await folderStoreRequest("get");
        } catch {
          return null;
        }
      }

      async function directoryPermission(handle, ask = false) {
        if (!handle || typeof handle.queryPermission !== "function") return false;
        try {
          const options = { mode: "read" };
          if (await handle.queryPermission(options) === "granted") return true;
          if (!ask || typeof handle.requestPermission !== "function") return false;
          return await handle.requestPermission(options) === "granted";
        } catch {
          return false;
        }
      }

      function fileExtension(name) {
        const index = name.lastIndexOf(".");
        return index >= 0 ? name.slice(index + 1).toLowerCase() : "";
      }

      function classifyName(name) {
        const extension = fileExtension(name);
        return extensionMap.get(extension) || null;
      }

      function classify(file) {
        return classifyName(file.name);
      }

      function normalizePath(path) {
        return String(path || "").replace(/\\/g, "/");
      }

      function recordName(record) {
        if (record.file) return record.file.name;
        if (record.name) return record.name;
        return normalizePath(record.path).split("/").filter(Boolean).pop() || "";
      }

      function recordPath(record) {
        return normalizePath(record.path || record.file?.webkitRelativePath || recordName(record));
      }

      async function ensureRecordFile(record) {
        if (!record.file && record.handle) {
          record.file = await record.handle.getFile();
        }
        return record.file;
      }

      async function ensureItemFile(item) {
        if (!item.file && item.handle) {
          item.file = await item.handle.getFile();
          item.size = item.file.size;
          item.lastModified = item.file.lastModified;
        }
        return item.file;
      }

      function itemSize(item) {
        return item.file?.size ?? item.size ?? 0;
      }

      function itemLastModified(item) {
        return item.file?.lastModified ?? item.lastModified ?? 0;
      }

      function formatItemSize(item) {
        return item.file || item.size ? formatSize(itemSize(item)) : "...";
      }

      function fileNameTagKey(name) {
        return normalizePath(name).split("/").filter(Boolean).pop().trim().toLocaleLowerCase("ru");
      }

      function tagKeyForItem(item) {
        return fileNameTagKey(item.name);
      }

      function tagAssignmentKeyForItem(item) {
        const folder = folderGroupKeyForItem(item);
        return folder ? `@folder/${folder.toLocaleLowerCase("ru")}/` : tagKeyForItem(item);
      }

      function isFolderTagKey(key) {
        return key.startsWith("@folder/") && key.endsWith("/");
      }

      function setManualItemTags(item, tags) {
        const key = tagAssignmentKeyForItem(item);
        if (tags.length || isFolderTagKey(key)) state.fileTags[key] = tags;
        else delete state.fileTags[key];
        item.tags = tags;
      }

      function rebuildFolderTagIndex() {
        state.folderEntries = new Map();
        state.items.forEach((item) => {
          if (!folderGroupKeyForItem(item)) return;
          const key = tagAssignmentKeyForItem(item);
          if (!state.folderEntries.has(key)) state.folderEntries.set(key, { itemIds: [], extensions: new Set(), legacyTags: new Set() });
          const folder = state.folderEntries.get(key);
          folder.itemIds.push(item.id);
          const extension = extensionTagForItem(item);
          if (extension) folder.extensions.add(extension);
          if (!Object.hasOwn(state.fileTags, key)) {
            (state.fileTags[tagKeyForItem(item)] || state.fileTags[item.id] || []).forEach((tag) => folder.legacyTags.add(tag));
          }
        });
        let migrated = false;
        state.folderEntries.forEach((folder, key) => {
          if (Object.hasOwn(state.fileTags, key)) return;
          // An empty folder entry prevents old per-file tags from coming back after removal.
          state.fileTags[key] = [...folder.legacyTags];
          migrated = true;
        });
        state.tagUsageCounts = null;
        if (migrated) {
          try { localStorage.setItem(tagKeys.fileTags, JSON.stringify(state.fileTags)); }
          catch { showToast("Не удалось сохранить общие теги папок"); }
        }
      }

      function normalizeStoredGroups(groups) {
        if (!Array.isArray(groups)) return [];
        const normalized = [];
        let maxId = 0;
        groups.forEach((group, index) => {
          const keys = Array.from(new Set((group?.keys || group?.itemIds || [])
            .map((key) => String(key || "").trim())
            .filter(Boolean)));
          if (keys.length < 2) return;
          const numericId = Number(String(group?.id || "").replace(/\D+/g, ""));
          if (Number.isFinite(numericId)) maxId = Math.max(maxId, numericId);
          normalized.push({
            id: group?.id || `group-${index + 1}`,
            keys,
            itemIds: []
          });
        });
        state.groupCounter = Math.max(state.groupCounter, maxId, normalized.length);
        return normalized;
      }

      function groupsForStorage() {
        return state.groups
          .map((group) => ({
            id: group.id,
            keys: Array.from(new Set([
              ...(group.keys || []),
              ...(group.itemIds || []).map((id) => state.itemEntryById.get(id)?.item).filter(Boolean).map(tagKeyForItem)
            ])).filter(Boolean)
          }))
          .filter((group) => group.keys.length >= 2);
      }

      function folderGroupKeyForItem(item) {
        const parts = normalizePath(item?.path || "").split("/").filter(Boolean);
        if (parts.length <= 2) return "";
        return parts.slice(0, -1).join("/");
      }

      function compareGroupItemIds(leftId, rightId) {
        const left = state.itemEntryById.get(leftId)?.item;
        const right = state.itemEntryById.get(rightId)?.item;
        if (!left || !right) return left ? -1 : right ? 1 : 0;
        return collator.compare(left.name, right.name) || collator.compare(left.path, right.path);
      }

      function sortGroupItemIds(itemIds) {
        return Array.from(new Set(itemIds.filter((id) => state.itemIdSet.has(id)))).sort(compareGroupItemIds);
      }

      function buildAutoGroups() {
        const manualItemIds = new Set();
        state.groups.forEach((group) => {
          (group.itemIds || []).forEach((id) => manualItemIds.add(id));
        });

        const byFolder = new Map();
        state.items.forEach((item) => {
          if (manualItemIds.has(item.id)) return;
          const key = folderGroupKeyForItem(item);
          if (!key || state.disabledAutoGroupKeys.has(key)) return;
          if (!byFolder.has(key)) byFolder.set(key, []);
          byFolder.get(key).push(item.id);
        });

        state.autoGroups = Array.from(byFolder.entries())
          .filter(([, itemIds]) => itemIds.length >= 2)
          .map(([key, itemIds]) => {
            const sortedIds = sortGroupItemIds(itemIds);
            return {
              id: `auto-folder:${key}`,
              auto: true,
              autoKey: key,
              keys: sortedIds
                .map((id) => state.itemEntryById.get(id)?.item)
                .filter(Boolean)
                .map(tagKeyForItem),
              itemIds: sortedIds
            };
          });
      }

      function rebuildGroupIndex() {
        state.itemGroupId = new Map();
        state.groupById = new Map();
        const register = (group) => {
          if ((group.itemIds || []).length < 2) return;
          state.groupById.set(group.id, group);
          (group.itemIds || []).forEach((id) => state.itemGroupId.set(id, group.id));
        };
        state.autoGroups.forEach(register);
        state.groups.forEach(register);
      }

      function pruneGroupsForItems() {
        const claimed = new Set();
        state.groups = state.groups
          .map((group) => {
            const keys = Array.from(new Set(group.keys || []));
            const resolved = keys
              .map((key) => state.items.find((item) => tagKeyForItem(item) === key)?.id)
              .filter(Boolean);
            const expanded = new Set(resolved);
            resolved.forEach((id) => {
              const item = state.itemEntryById.get(id)?.item;
              const folderKey = folderGroupKeyForItem(item);
              if (!folderKey || state.disabledAutoGroupKeys.has(folderKey)) return;
              state.folderEntries.get(tagAssignmentKeyForItem(item))?.itemIds.forEach((pageId) => expanded.add(pageId));
            });
            const itemIds = sortGroupItemIds([...expanded].filter((id) => !claimed.has(id)));
            itemIds.forEach((id) => claimed.add(id));
            return { ...group, keys, itemIds };
          });
        buildAutoGroups();
        rebuildGroupIndex();
      }

      function groupForItem(item) {
        if (!item) return null;
        const groupId = state.itemGroupId.get(item.id);
        return groupId ? state.groupById.get(groupId) || null : null;
      }

      function groupItemIdsForIndex(index) {
        const item = state.items[index];
        if (!item) return [];
        const group = groupForItem(item);
        if (!group) return [item.id];
        return group.itemIds;
      }

      function itemIndexById(id) {
        return state.itemEntryById.get(id)?.index ?? -1;
      }

      function groupSelectionIdsForIndex(index) {
        return groupItemIdsForIndex(index).filter(Boolean);
      }

      function groupSizeForItem(item) {
        return groupForItem(item)?.itemIds.filter((id) => state.itemIdSet.has(id)).length || 1;
      }

      function sameGroupIndex(leftIndex, rightIndex) {
        if (leftIndex === rightIndex) return true;
        const left = state.items[leftIndex];
        const right = state.items[rightIndex];
        if (!left || !right) return false;
        const leftGroup = state.itemGroupId.get(left.id);
        return Boolean(leftGroup && leftGroup === state.itemGroupId.get(right.id));
      }

      function galleryCardActive(index) {
        return sameGroupIndex(index, state.currentIndex);
      }

      function extensionTagForName(name) {
        const extension = fileExtension(name);
        return extension ? `.${extension}` : "";
      }

      function extensionTagForItem(item) {
        return extensionTagForName(item.name);
      }

      function tagsForFile(file, fallbackId) {
        const nameKey = fileNameTagKey(file.name);
        return state.fileTags[nameKey] || state.fileTags[fallbackId] || [];
      }

      function topLevelPath(path) {
        const normalized = normalizePath(path);
        const parts = normalized.split("/").filter(Boolean);
        if (parts.length <= 2) return true;
        return false;
      }

      function formatSize(bytes) {
        if (!Number.isFinite(bytes)) return "";
        const units = ["Б", "КБ", "МБ", "ГБ"];
        let value = bytes;
        let unit = 0;
        while (value >= 1024 && unit < units.length - 1) {
          value /= 1024;
          unit += 1;
        }
        const digits = value >= 10 || unit === 0 ? 0 : 1;
        return `${value.toFixed(digits)} ${units[unit]}`;
      }

      function folderName(records) {
        const firstPath = records.find((record) => record.path.includes("/"))?.path || "";
        return firstPath ? firstPath.split("/").filter(Boolean)[0] : "Выбранные файлы";
      }

      function showToast(message) {
        window.clearTimeout(state.toastTimer);
        els.toast.textContent = message;
        els.toast.classList.add("show");
        state.toastTimer = window.setTimeout(() => {
          els.toast.classList.remove("show");
        }, 3200);
      }

      function startLoading(title = "Загрузка", detail = "Подготовка файлов") {
        state.loading = true;
        els.loadingOverlay.hidden = false;
        updateLoading({ title, detail });
      }

      function updateLoading({ title, detail, current = 0, total = 0 } = {}) {
        if (!state.loading) return;
        if (title) els.loadingTitle.textContent = title;
        if (detail) els.loadingDetail.textContent = detail;

        const hasTotal = Number.isFinite(total) && total > 0;
        els.loadingOverlay.classList.toggle("indeterminate", !hasTotal);
        if (hasTotal) {
          const percent = Math.max(0, Math.min(100, Math.round((current / total) * 100)));
          els.loadingFill.style.width = `${percent}%`;
          els.loadingPercent.textContent = `${percent}%`;
          els.loadingDetail.textContent = detail || `${current} / ${total}`;
        } else {
          els.loadingFill.style.width = "";
          els.loadingPercent.textContent = current ? `${current} файлов` : "...";
        }
      }

      function endLoading() {
        state.loading = false;
        els.loadingOverlay.hidden = true;
        els.loadingOverlay.classList.add("indeterminate");
        els.loadingFill.style.width = "0%";
        els.loadingPercent.textContent = "...";
      }

      function reportRuntimeError(error, fallback = "РџСЂРёР»РѕР¶РµРЅРёРµ РЅРµ СЃРјРѕРіР»Рѕ Р·Р°РіСЂСѓР·РёС‚СЊСЃСЏ") {
        const message = error?.message || String(error || fallback);
        els.status.textContent = "РћС€РёР±РєР° Р·Р°РіСЂСѓР·РєРё";
        els.errorState.hidden = false;
        els.emptyState.hidden = true;
        els.errorState.innerHTML = `<strong>${escapeHtml(fallback)}</strong>${escapeHtml(message)}`;
        showToast(fallback);
      }

      window.addEventListener("error", (event) => {
        reportRuntimeError(event.error || event.message);
      });

      window.addEventListener("unhandledrejection", (event) => {
        reportRuntimeError(event.reason);
      });

      function mediaTypeOrder(kind) {
        return kind === "image" ? 0 : kind === "video" ? 1 : 2;
      }

      function recordKey(record) {
        const file = record.file;
        const path = recordPath(record);
        if (!file) return `${path}|handle`;
        return `${path}|${file.size}|${file.lastModified}`;
      }

      function sortItems(items) {
        const mode = els.sortSelect.value;
        if (mode === "random") return;
        items.sort((a, b) => {
          const byName = collator.compare(a.name, b.name) || collator.compare(a.path, b.path);
          if (mode === "date") return itemLastModified(b) - itemLastModified(a) || byName;
          if (mode === "type") return mediaTypeOrder(a.kind) - mediaTypeOrder(b.kind) || byName;
          if (mode === "size") return itemSize(b) - itemSize(a) || byName;
          return byName;
        });
      }

      async function recordsToItems(records, options = {}) {
        const seen = new Set();
        const includeSubfolders = els.subfoldersToggle.checked;
        const items = [];
        let skippedUnsupported = 0;
        let skippedSubfolder = 0;
        let lastYield = performance.now();
        const total = records.length;
        const needsMetadata = els.sortSelect.value === "date" || els.sortSelect.value === "size";

        for (let index = 0; index < records.length; index += 1) {
          const record = records[index];
          const name = recordName(record);
          const path = recordPath(record);
          if (!includeSubfolders && !topLevelPath(path)) {
            skippedSubfolder += 1;
            continue;
          }

          const type = classifyName(name);
          if (!type) {
            skippedUnsupported += 1;
            continue;
          }

          const file = needsMetadata ? await ensureRecordFile(record) : record.file || null;
          const key = record.id || recordKey(record);
          record.id = key;
          if (!seen.has(key)) {
            seen.add(key);
            items.push({
              id: key,
              file,
              handle: record.handle || null,
              parentHandle: record.parentHandle || null,
              record,
              size: file?.size || 0,
              lastModified: file?.lastModified || 0,
              path,
              name,
              extension: fileExtension(name).toUpperCase(),
              kind: type.kind,
              label: type.label,
              icon: type.icon,
              tags: tagsForFile({ name }, key)
            });
          }

          const elapsed = performance.now() - lastYield;
          if (index % 500 === 0 || elapsed > 80) {
            updateLoading({
              title: options.title || "Обработка файлов",
              detail: `${index + 1} / ${total}`,
              current: index + 1,
              total
            });
            lastYield = performance.now();
            await yieldToBrowser();
          }
        }

        updateLoading({ title: "Сортировка", detail: `${items.length} файлов`, current: total, total });
        await yieldToBrowser();
        sortItems(items);
        return { items, skippedUnsupported, skippedSubfolder };
      }

      function updateStatus(result) {
        const details = [];
        if (result.skippedUnsupported) details.push(`${result.skippedUnsupported} не медиа`);
        if (result.skippedSubfolder) details.push(`${result.skippedSubfolder} из подпапок`);

        if (!state.items.length) {
          setEmptyState("Медиа не найдены", details.length ? details.join(", ") : "Поддерживаются фото, GIF, видео и аудио.");
          els.status.textContent = state.sourceRecords.length ? "Нет поддерживаемых файлов" : "Папка не выбрана";
          return;
        }

        els.status.textContent = `${folderName(state.sourceRecords)} · ${state.items.length} файлов`;
        if (details.length) showToast(`Пропущено: ${details.join(", ")}`);
      }

      function updateNowText() {
        const item = state.items[state.currentIndex];
        if (!item) {
          els.nowTitle.textContent = "Нет файла";
          els.nowSub.textContent = "0 / 0";
          els.progressBar.style.width = "0%";
          return;
        }

        els.nowTitle.textContent = item.name;
        els.nowSub.textContent = `${state.currentIndex + 1} / ${state.items.length} · ${item.label} · ${formatItemSize(item)}`;
        els.progressBar.style.width = `${Math.round(((state.currentIndex + 1) / state.items.length) * 100)}%`;
      }

      async function applyItemsFromSource(preferredId, options = {}) {
        const startedLoading = options.loading !== false && !state.loading;
        if (startedLoading) startLoading(options.loadingTitle || "Загрузка файлов", "Подготовка");

        let result;
        try {
          result = await recordsToItems(state.sourceRecords, {
            title: options.processingTitle || "Обработка файлов"
          });
        } catch (error) {
          if (startedLoading) endLoading();
          throw error;
        }
        state.items = result.items;
        state.tagUsageCounts = null;
        state.itemIds = state.items.map((item) => item.id);
        state.itemIdSet = new Set(state.itemIds);
        state.itemEntryById = new Map(state.items.map((item, index) => [item.id, { item, index }]));
        rebuildFolderTagIndex();
        state.autoTags = new Set(state.items.map(extensionTagForItem).filter(Boolean));
        const pendingAutoTags = state.items.filter((item) => item.record.autoTagPending);
        pendingAutoTags.forEach((item) => { item.record.autoTagPending = false; });
        if (state.autoTagNewFiles && pendingAutoTags.length) await autoTagImportedItems(pendingAutoTags);
        invalidateAutoTagPreview();
        pruneGroupsForItems();
        syncGalleryOrder();

        if (!state.items.length) {
          state.currentIndex = -1;
          state.queue = [];
          state.queuePosition = -1;
          state.viewMode = "gallery";
          els.app.classList.remove("detail-mode");
          els.detailOverlay.hidden = true;
          els.stage.inert = false;
          state.gallerySelection.clear();
          state.gallerySelectMode = false;
          els.galleryView.hidden = true;
          els.galleryBulkBar.hidden = true;
          els.mediaLayer.hidden = false;
          clearGalleryRuntime();
          stopImageTimer();
          clearCurrentMedia();
          updateStatus(result);
          renderPlaylist();
          renderTags();
          renderTagFilters();
          renderTagFilterPanel();
          updateControls();
          if (startedLoading) endLoading();
          return;
        }

        const foundIndex = state.items.findIndex((item) => item.id === preferredId);
        const targetIndex = foundIndex >= 0 ? foundIndex : 0;
        const canPreserve = options.preserve && foundIndex >= 0;
        const shouldReload = canPreserve ? false : foundIndex < 0 || options.reload || state.currentIndex < 0 || targetIndex !== state.currentIndex;
        const openDetail = options.openDetail ?? (state.viewMode === "single" && (options.preserve || options.reload));
        state.currentIndex = targetIndex;
        buildQueue(targetIndex);
        updateStatus(result);

        if (openDetail && shouldReload) {
          showItem(targetIndex, options.play ?? true);
          renderPlaylist();
          renderTags();
          renderTagFilters();
          renderTagFilterPanel();
          updateControls();
        } else if (openDetail) {
          updateNowText();
          renderPlaylist();
          renderTags();
          renderTagFilters();
          renderTagFilterPanel();
          updateControls();
          scrollActiveIntoView();
        } else {
          state.paused = true;
          stopImageTimer();
          clearCurrentMedia();
          updateNowText();
          renderPlaylist();
          renderTags();
          renderTagFilters();
          renderTagFilterPanel();
          setViewMode("gallery");
          updateControls();
          scrollActiveIntoView();
        }

        if (startedLoading) endLoading();
      }

      async function replaceRecords(records, options = {}) {
        records.forEach((record) => { record.autoTagPending = options.autoTagNewFiles !== false; });
        state.sourceRecords = records;
        state.currentIndex = -1;
        await applyItemsFromSource(undefined, { reload: true, play: false, openDetail: false, ...options });
      }

      async function addRecords(records) {
        if (!records.length) return;
        const currentId = state.items[state.currentIndex]?.id;
        const seen = new Set();
        const fresh = [];
        let lastYield = performance.now();

        for (let index = 0; index < state.sourceRecords.length; index += 1) {
          seen.add(recordKey(state.sourceRecords[index]));
          if (index % 1000 === 0 && performance.now() - lastYield > 80) {
            lastYield = performance.now();
            await yieldToBrowser();
          }
        }

        for (let index = 0; index < records.length; index += 1) {
          const record = {
            ...records[index],
            path: recordPath(records[index])
          };
          const id = recordKey(record);
          if (!seen.has(id)) {
            seen.add(id);
            record.id = id;
            record.autoTagPending = true;
            fresh.push(record);
          }

          const elapsed = performance.now() - lastYield;
          if (index % 500 === 0 || elapsed > 80) {
            updateLoading({
              title: "Проверка файлов",
              detail: `${index + 1} / ${records.length}`,
              current: index + 1,
              total: records.length
            });
            lastYield = performance.now();
            await yieldToBrowser();
          }
        }

        if (!fresh.length) {
          showToast("Эти файлы уже есть в плейлисте");
          return;
        }

        state.sourceRecords = state.sourceRecords.concat(fresh);
        await applyItemsFromSource(currentId, { preserve: Boolean(currentId), reload: !currentId, play: !currentId });
      }

      function setEmptyState(title, text) {
        els.emptyState.hidden = false;
        els.errorState.hidden = true;
        els.emptyState.innerHTML = `<strong>${escapeHtml(title)}</strong>${escapeHtml(text)}`;
        els.nowTitle.textContent = "Нет файла";
        els.nowSub.textContent = "0 / 0";
        els.progressBar.style.width = "0%";
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (character) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#39;"
        }[character]));
      }

      function normalizeSearchText(value) {
        return String(value || "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/ё/g, "е")
          .replace(/Ё/g, "Е")
          .toLocaleLowerCase("ru")
          .replace(/[^\p{L}\p{N}]+/gu, " ")
          .trim();
      }

      function shuffle(array) {
        const copy = array.slice();
        for (let index = copy.length - 1; index > 0; index -= 1) {
          const target = Math.floor(Math.random() * (index + 1));
          [copy[index], copy[target]] = [copy[target], copy[index]];
        }
        return copy;
      }

      function buildQueue(anchorIndex = state.currentIndex >= 0 ? state.currentIndex : 0) {
        const galleryQueue = visibleGalleryEntries().map(({ index }) => index);
        const anchorPosition = queuePositionForIndex(anchorIndex, galleryQueue);
        const all = anchorPosition >= 0
          ? galleryQueue
          : state.items.map((_, index) => index);
        if (!all.length) {
          state.queue = [];
          state.queuePosition = -1;
          return;
        }

        state.queue = all;
        state.queuePosition = Math.max(0, queuePositionForIndex(anchorIndex, all));
      }

      function queuePositionForIndex(index, queue = state.queue) {
        const item = state.items[index];
        if (!item) return -1;
        const groupId = state.itemGroupId.get(item.id);
        return queue.findIndex((queueIndex) => {
          if (queueIndex === index) return true;
          if (!groupId) return false;
          const queueItem = state.items[queueIndex];
          return queueItem && state.itemGroupId.get(queueItem.id) === groupId;
        });
      }

      function syncDetailGroup(index) {
        const ids = groupItemIdsForIndex(index);
        const item = state.items[index];
        state.detailGroupItemIds = ids.length ? ids : [];
        state.detailGroupPosition = item ? Math.max(0, ids.indexOf(item.id)) : 0;
      }

      function showQueuePosition(position, shouldPlay, options = {}) {
        if (!state.queue.length) buildQueue();
        if (!state.queue.length) return;

        const wrapped = (position + state.queue.length) % state.queue.length;
        state.queuePosition = wrapped;
        const baseIndex = state.queue[wrapped];
        const ids = groupItemIdsForIndex(baseIndex);
        const targetId = options.preferLastInGroup && ids.length > 1 ? ids[ids.length - 1] : ids[0];
        const targetIndex = itemIndexById(targetId) >= 0 ? itemIndexById(targetId) : baseIndex;
        showItem(targetIndex, shouldPlay);
      }

      function manualItemTags(item) {
        return state.fileTags[tagAssignmentKeyForItem(item)] || state.fileTags[tagKeyForItem(item)] || state.fileTags[item.id] || [];
      }

      function itemTags(item) {
        const extensions = state.folderEntries.get(tagAssignmentKeyForItem(item))?.extensions;
        return Array.from(new Set([
          ...manualItemTags(item),
          ...(extensions || [extensionTagForItem(item)])
        ].filter(Boolean)));
      }

      function allKnownTags() {
        return Array.from(new Set([...state.tags, ...state.autoTags].filter(Boolean)));
      }

      function tagUsageCount(tag) {
        if (!state.tagUsageCounts) {
          state.tagUsageCounts = new Map();
          state.items.forEach((item) => itemTags(item).forEach((name) => {
            state.tagUsageCounts.set(name, (state.tagUsageCounts.get(name) || 0) + 1);
          }));
        }
        return state.tagUsageCounts.get(tag) || 0;
      }

      function sortedTags(tags = allKnownTags()) {
        return Array.from(new Set(tags.filter(Boolean))).sort((a, b) => {
          return tagUsageCount(b) - tagUsageCount(a) || collator.compare(a, b);
        });
      }

      function tagsHtml(item) {
        const tags = sortedTags(itemTags(item));
        if (!tags.length) return "";
        const activeFilters = new Set(state.tagFilters);
        return `<span class="item-tags">${tags.map((tag) => `<button class="mini-tag${activeFilters.has(tag) ? " active" : ""}" type="button" data-filter-tag="${escapeHtml(tag)}" title="Фильтр по тегу ${escapeHtml(tag)}">${escapeHtml(tag)}</button>`).join("")}</span>`;
      }

      function renderTagFilters() {
        if (!state.tagFilters.length) {
          els.tagFilters.innerHTML = "";
          return;
        }

        els.tagFilters.innerHTML = [
          ...sortedTags(state.tagFilters).map((tag) => `<button class="filter-chip" type="button" data-filter-tag="${escapeHtml(tag)}" title="Убрать фильтр">${escapeHtml(tag)} ×</button>`),
          `<button class="clear-filters" type="button" data-clear-filters="true">Сбросить</button>`
        ].join("");
      }

      function renderTagFilterPanel() {
        const tags = allKnownTags();
        if (!tags.length) {
          els.tagFilterPanel.innerHTML = `<button class="tag-chip empty" type="button" disabled>Нет тегов</button>`;
          return;
        }

        const activeFilters = new Set(state.tagFilters);
        els.tagFilterPanel.innerHTML = sortedTags(tags).map((tag) => `
          <button class="filter-tag${activeFilters.has(tag) ? " active" : ""}" type="button" data-filter-tag="${escapeHtml(tag)}" aria-pressed="${activeFilters.has(tag)}" title="Отбор по тегу ${escapeHtml(tag)}">
            <span class="tag-name">${escapeHtml(tag)}</span>
            <span class="tag-count">${tagUsageCount(tag)}</span>
          </button>
        `).join("");
      }

      function renderTags() {
        const current = state.items[state.currentIndex];
        if (!current) {
          if (!els.tagPicker.hidden) closeTagPicker();
          renderDetailInfo();
